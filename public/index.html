// =====================================================
// TV PLAY
// =====================================================

async function playTV(channel) {

    errorBox.textContent = "";

    hideBlv();

    currentSourceBox.style.display = "none";

    title.textContent =
        channel.name || "Đang phát";

    status.textContent = "Đang mở...";

    try {

        console.log("================================");
        console.log("TV PLAY START");
        console.log("CHANNEL:", channel.name);
        console.log("SOURCE URL:", channel.url);

        await stopPlayer();

        // Link khong khoa -> phat thang nhu VLC, KHONG goi /api/resolve.
        if (!channelNeedsServer(channel)) {
            try {
                await tryPlayUrlDirect(channel.url, channel.name || "");

                return;
            } catch (directErr) {
                console.warn(
                    "DIRECT hong, chuyen sang API:",
                    directErr && directErr.message
                );
            }
        }

        const cacheKey =
            "tv:" + channel.url;

        const cached =
            streamCache.get(cacheKey);

        let result;

        if (
            cached &&
            Date.now() - cached.time <
                STREAM_CACHE_TIME
        ) {
            result = cached.data;
        } else {
            // Nguon (livesport, tv360, vtvprime...) chap chon: co luc
            // 502/404/network loi -> tu thu lai vai lan truoc khi bao loi.
            const RESOLVE_ATTEMPTS = 3;

            let lastError = null;

            for (let attempt = 1; attempt <= RESOLVE_ATTEMPTS; attempt++) {
                try {

                    const response = await fetch(
                        "/api/resolve?url=" +
                        encodeURIComponent(channel.url)
                    );

                    console.log(
                        "RESOLVE HTTP:",
                        response.status,
                        "(lan " + attempt + ")"
                    );

                    if (!response.ok) {
                        throw new Error(
                            "Resolve HTTP " +
                            response.status
                        );
                    }

                    result = await response.json();

                    if (!result.ok) {
                        throw new Error(
                            result.error ||
                            "Resolve failed"
                        );
                    }

                    streamCache.set(
                        cacheKey,
                        {
                            time: Date.now(),
                            data: result
                        }
                    );

                    lastError = null;
                    break;

                } catch (e) {

                    lastError = e;

                    if (attempt < RESOLVE_ATTEMPTS) {
                        status.textContent =
                            "Đang thử lại (" + attempt + "/" + RESOLVE_ATTEMPTS + ")...";

                        await new Promise(r =>
                            setTimeout(r, 1200 * attempt)
                        );
                    }
                }
            }

            if (lastError) {
                throw lastError;
            }
        }

        console.log("RESOLVE RESULT:", result);

        if (!result.ok) {
            throw new Error(
                result.error ||
                "Resolve failed"
            );
        }

        await stopPlayer();

        const sources =
            pickPlaySources(result);

        const url =
            sources.primary ||
            channel.url;


        const fallbackUrl =
            sources.fallback;

        const clearKeys =
            result.clearKeys || {};

        console.log("PLAY URL:", url);
        console.log("KIND:", result.kind);
        console.log("CLEARKEYS:", clearKeys);
        console.log(
            "CLEARKEY COUNT:",
            Object.keys(clearKeys).length
        );

        // ==============================
        // HLS
        // ==============================

        if (
            result.kind === "hls" ||
            isHLS(url)
        ) {

            console.log(
                "TV PLAY TYPE: HLS"
            );

            await playHLS(
                url,
                fallbackUrl
            );

            status.textContent =
                "🔴 Đang phát";

            return;
        }

        if (
            result.contentType === "video/mp2t" ||
            /\.ts(?:\?|$)/i.test(url)
        ) {
            await playMpegTs(url);
            status.textContent = "🔴 Đang phát";
            return;
        }

        // ==============================
        // DASH
        // ==============================

        if (
            result.kind === "dash" ||
            isMPD(url)
        ) {

            currentDashUrl = url;
            dashRecoveryAttempts = 0;

            console.log(
                "TV PLAY TYPE: DASH"
            );

            await initPlayer();

            // Cấu hình ClearKey TRƯỚC khi load MPD để Shaka đọc
            // DRM config ngay tại thời điểm load() — choantuoi
            // nếu để sau thì Shaka có thể đãGc/clear config cũ.
            if (
                Object.keys(clearKeys).length > 0
            ) {

                console.log(
                    "CONFIG CLEARKEY"
                );

                await shakaPlayer.configure({
                    drm: {
                        clearKeys:
                            clearKeys
                    }
                });
            }

            console.log(
                "SHAKA LOAD:",
                url
            );

            await shakaPlayer.load(url);

            populateShakaQualities();

            console.log(
                "SHAKA LOAD SUCCESS"
            );

            status.textContent =
                "🔴 Đang phát";

            return;
        }

        // ==============================
        // DIRECT VIDEO
        // ==============================

        console.log(
            "TV PLAY TYPE: DIRECT VIDEO"
        );

        await playDirectVideo(
            url,
            fallbackUrl
        );

        status.textContent =
            "🔴 Đang phát";

    } catch (err) {

        console.error(
            "================================"
        );

        console.error(
            "TV PLAY ERROR:",
            err
        );

        console.error(
            "NAME:",
            err?.name
        );

        console.error(
            "MESSAGE:",
            err?.message
        );

        console.error(
            "STACK:",
            err?.stack
        );

        console.error(
            "================================"
        );

        status.textContent =
            "Không phát được";

        errorBox.textContent =
            (err?.message || String(err));
    }
}

// =====================================================
// STOP
// =====================================================

async function stopPlayer() {

    if (mpegtsPlayer) {
        try {
            mpegtsPlayer.pause();
            mpegtsPlayer.unload();
            mpegtsPlayer.detachMediaElement();
            mpegtsPlayer.destroy();
        } catch (e) {
            console.warn("MPEG-TS destroy error:", e);
        }

        mpegtsPlayer = null;
    }


    resetQualityOptions();

    // ==============================
    // HỦY HLS
    // ==============================

    if (hlsPlayer) {

        try {
            await hlsPlayer.destroy();
        } catch (e) {
            console.warn(
                "HLS destroy error:",
                e
            );
        }

        hlsPlayer = null;
    }


    // ==============================
    // HỦY SHAKA HOÀN TOÀN
    // ==============================

    if (shakaPlayer) {

        try {
            await shakaPlayer.destroy();
        } catch (e) {
            console.warn(
                "Shaka destroy error:",
                e
            );
        }

        shakaPlayer = null;
    }


    // ==============================
    // RESET VIDEO
    // ==============================

    try {
        video.pause();
    } catch {}


    video.removeAttribute("src");

    video.load();
}


// =====================================================
// TYPE
// =====================================================

function isMPD(
    url
) {

    const u =
        String(url || "");


    return (
        /\.mpd(?:\?|$)/i.test(u) ||
        /manifest\.mpd/i.test(u)
    );
}


function isHLS(
    url
) {

    const u =
        String(url || "");


    return (
        /\.m3u8(?:\?|$)/i.test(u) ||
        /m3u8/i.test(u)
    );
}

// =====================================================
// LOGO HELPER
// =====================================================
// lazy + no-referrer: tranh logo ben ngoai chan load/chan render,
// va tu an khi loi (nhieu logo nguon khong cho hot-link).

// =====================================================
// RENDER THEO LO (CHUNKED)
// =====================================================
// Chen tung lo phan tu vao container thay vi chen het mot lan.
// Voi 500+ kenh, chen het mot lan se block UI vai giay -> treo.
// Dung requestAnimationFrame giua cac lo de giu UI muot.

const RENDER_CHUNK_SIZE = 40;

function renderChunked(items, createElement, container) {

    let index = 0;

    // Huy render cu neu nguoi dung doi tab giua chung.
    const token = ++renderChunked.token;

    function step() {

        if (token !== renderChunked.token) {
            return;
        }

        const end = Math.min(
            index + RENDER_CHUNK_SIZE,
            items.length
        );

        const frag = document.createDocumentFragment();

        for (; index < end; index++) {

            const el = createElement(items[index], index);

            if (el) {
                frag.appendChild(el);
            }
        }

        container.appendChild(frag);

        if (index < items.length) {
            requestAnimationFrame(step);
        }
    }

    requestAnimationFrame(step);
}

renderChunked.token = 0;

// Skeleton card (the xam gia) hien khi dang tai.

}

function setupLogoImg(img, src) {

}

// =====================================================
// ESCAPE
// =====================================================

function escapeHtml(
    text
) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}

// CHAT CHUNG (poll nhe qua server, luu RAM)
// =====================================================

const chatPanel = document.getElementById("chatPanel");
const chatMessages = document.getElementById("chatMessages");
const chatInput = document.getElementById("chatInput");
const chatNameInput = document.getElementById("chatNameInput");

let chatLastId = 0;
let chatPollTimer = null;

let chatName =
    localStorage.getItem("tv360chatname") ||
    ("Khách " + Math.floor(Math.random() * 900 + 100));

chatNameInput.value = chatName;

chatNameInput.addEventListener(
    "change",
    () => {

        chatName =
            chatNameInput.value.trim() ||
            ("Khách " + Math.floor(Math.random() * 900 + 100));

        chatNameInput.value = chatName;

        localStorage.setItem("tv360chatname", chatName);
    }
);

function chatSetOpen(open) {

    const willOpen =
        typeof open === "boolean"
            ? open
            : !chatPanel.classList.contains("open");

    chatPanel.classList.toggle(
        "open",
        willOpen
    );

    document.getElementById("chatToggle").textContent =
        willOpen ? "✕" : "💬";

    if (willOpen) {
        pollChat();
        setTimeout(() => chatInput.focus(), 80);
    }
}

document.getElementById("chatToggle").onclick =
    () => chatSetOpen();

function chatAppend(m) {

    const empty = chatMessages.querySelector(".chat-empty");

    if (empty) {
        empty.remove();
    }

    const div = document.createElement("div");

    div.className =
        "chat-msg" + (m.name === chatName ? " self" : "");

    div.innerHTML =
        "<b>" + escapeHtml(m.name) + "</b>" +
        escapeHtml(m.text);

    chatMessages.appendChild(div);

    // Gioi han DOM: giu 150 tin cuoi
    while (chatMessages.children.length > 150) {
        chatMessages.removeChild(chatMessages.firstChild);
    }
}

async function pollChat() {

    try {

        const r =
            await fetch("/api/chat?after=" + chatLastId);

        const j =
            await r.json();

        if (!j || !j.ok || !j.messages.length) {
            return;
        }

        const atBottom =
            chatMessages.scrollTop + chatMessages.clientHeight >=
            chatMessages.scrollHeight - 40;

        for (const m of j.messages) {
            chatLastId = Math.max(chatLastId, m.id);
            chatAppend(m);
        }

        if (atBottom) {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

    } catch {}
}

document.getElementById("chatForm").addEventListener(
    "submit",
    async e => {

        e.preventDefault();

        const text = chatInput.value.trim();

        if (!text) return;

        chatInput.value = "";

        try {

            await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: chatName, text })
            });

            pollChat();

        } catch {}
    }
);

setInterval(pollChat, 5000);
