﻿﻿<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>TV360 WEB PLAYER</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.2/shaka-player.compiled.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.min.js"></script>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #0d0d0d;

    color: #fff;

    font-family:
        Arial,
        sans-serif;

    overflow: hidden;
}


/* =====================================================
   TOP
===================================================== */

.top {

    height: 58px;

    background: #171717;

    display: flex;

    align-items: center;

    padding: 8px 14px;

    gap: 8px;

    border-bottom:
        1px solid #2d2d2d;
}


.tab {

    border: 0;

    padding:
        11px 20px;

    border-radius: 9px;

    background: #292929;

    color: #ddd;

    cursor: pointer;

    font-size: 14px;

    font-weight: 600;
}


.tab:hover {

    background: #353535;
}


.tab.active {

    background: #e50914;

    color: #fff;
}


/* =====================================================
   MAIN
===================================================== */

.main {

    height:
        calc(100vh - 58px);

    display: flex;
}


/* =====================================================
   LEFT
===================================================== */

.left {

    width: 390px;

    flex-shrink: 0;

    background: #111;

    border-right:
        1px solid #303030;

    overflow-y: auto;

    padding: 12px;
}


.left::-webkit-scrollbar {

    width: 7px;
}


.left::-webkit-scrollbar-thumb {

    background: #444;

    border-radius: 10px;
}


/* =====================================================
   FOOTBALL FILTER
===================================================== */

.football-filters {

    display: flex;

    gap: 7px;

    margin-bottom: 12px;
}


.filter-btn {

    border: 0;

    border-radius: 7px;

    padding:
        8px 11px;

    background: #282828;

    color: #bbb;

    cursor: pointer;

    font-size: 12px;

    font-weight: 600;
}


.filter-btn.active {

    background:
        #e50914;

    color: #fff;
}


/* =====================================================
   SOURCE GROUPS
===================================================== */

.groups {

    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    margin-bottom: 12px;
}


.group {

    background: #242424;

    border:
        1px solid #333;

    color: #ccc;

    border-radius: 16px;

    padding:
        6px 10px;

    cursor: pointer;

    font-size: 11px;

    display: inline-flex;

    align-items: center;

    gap: 6px;

    transition:
        background .15s,
        transform .1s;
}


.group:hover {

    background: #303030;

    transform:
        translateY(-1px);
}


.group.active {

    background:
        #e50914;

    color: #fff;

    border-color:
        #e50914;
}


.source-logo {

    width: 18px;

    height: 18px;

    object-fit: contain;

    border-radius: 4px;
}


/* =====================================================
   MATCH
===================================================== */

.match {

    background: #191919;

    border:
        1px solid #303030;

    border-radius: 10px;

    padding: 13px;

    margin-bottom: 9px;

    cursor: pointer;

    transition:
        background .15s,
        border-color .15s,
        transform .1s;
}


.match:hover {

    background: #222;

    border-color: #555;

    transform:
        translateY(-1px);
}


.match.selected {

    border-color:
        #e50914;

    background: #202020;
}


.match-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 8px;
}


.match-time {

    color: #999;

    font-size: 12px;

    font-weight: 600;
}


.live-badge {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    color: #ff3945;

    font-size: 11px;

    font-weight: bold;
}


.live-dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background:
        #ff2638;

    box-shadow:
        0 0 7px #ff2638;
}


.match-name {

    font-size: 16px;

    line-height: 1.35;

    font-weight: 700;

    color: #fff;

    margin-bottom: 9px;
}


.match-source {

    color: #888;

    font-size: 11px;

    margin-bottom: 9px;
}


.match-footer {

    display: flex;

    align-items: center;

    justify-content: space-between;

    color: #888;

    font-size: 11px;
}


.match-blv-count {

    color: #aaa;
}


.watch-text {

    color:
        #e50914;

    font-weight: bold;
}

/* =====================================================
   BÓNG ĐÁ VN: CARD TRẬN
===================================================== */

.vn-match-card {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 12px;

    margin-bottom: 9px;

    background: #191919;

    border: 1px solid #303030;

    border-radius: 10px;

    cursor: pointer;

    transition:
        background .15s,
        border-color .15s,
        transform .1s;
}

.vn-match-card:hover {

    background: #222;

    border-color: #555;

    transform:
        translateY(-1px);
}

.vn-match-logo {

    width: 46px;

    height: 46px;

    object-fit: contain;

    background: #222;

    border-radius: 8px;

    flex-shrink: 0;
}

.vn-match-body {

    min-width: 0;

    flex: 1;
}

.vn-match-head {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 5px;
}

.vn-match-time {

    color: #999;

    font-size: 12px;

    font-weight: 600;
}

.vn-match-title {

    font-size: 15px;

    font-weight: 700;

    color: #fff;

    line-height: 1.35;
}

.vn-match-foot {

    margin-top: 6px;

    color: #888;

    font-size: 11px;
}

/* =====================================================
   TV
===================================================== */

.channel {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 9px;

    margin-bottom: 5px;

    border-radius: 8px;

    cursor: pointer;

    background: #191919;

    border:
        1px solid #292929;
}


.channel:hover {

    background: #252525;
}


.logo {

    width: 38px;

    height: 38px;

    object-fit: contain;

    background: #222;

    border-radius: 6px;
}

/* Badge chu cai dau cho site khong co logo rieng */
.logo-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-weight: 700;
    font-size: 17px;
    color: #fff;
    background: linear-gradient(135deg, #d32f2f, #8b0000);
}


.channel-name {
    font-size: 13px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* =====================================================
   SKELETON (dang tai)
===================================================== */

.skeleton {
    pointer-events: none;
}

.sk-logo {
    width: 38px;
    height: 38px;
    border-radius: 6px;
    flex-shrink: 0;
    background: #262626;
    animation: sk-pulse 1.4s ease-in-out infinite;
}

.sk-line {
    height: 13px;
    flex: 1;
    max-width: 60%;
    border-radius: 4px;
    background: #262626;
    animation: sk-pulse 1.4s ease-in-out infinite;
}

@keyframes sk-pulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: .45;
    }
}

/* =====================================================
   RIGHT
===================================================== */

.right {

    flex: 1;

    min-width: 0;

    background: #000;

    display: flex;

    flex-direction: column;

    overflow-y: auto;
}


/* =====================================================
   PLAYER
===================================================== */

.player-box {

    width: 100%;

    aspect-ratio: 16 / 9;

    max-height: 72vh;

    background: #000;

    position: relative;

    flex-shrink: 0;
}


video {

    width: 100%;

    height: 100%;

    display: block;

    background: #000;
}

.player-actions {

    position: absolute;

    right: 0;

    bottom: 0;

    left: 0;

    z-index: 2;

    padding: 34px 12px 10px;

    background: linear-gradient(
        to top,
        rgba(0, 0, 0, .9),
        rgba(0, 0, 0, 0)
    );

    opacity: 1;

    transition: opacity .22s ease;
}

.player-box.controls-hidden .player-actions {

    opacity: 0;

    pointer-events: none;
}

/* Thanh tua: khung .progress-bar giu vi tri + ve nen/fill, input range
   nam tren cung de nhan thao tac keo (vung cham cao 22-28px). */
.progress-bar {

    position: relative;

    display: flex;

    align-items: center;

    width: 100%;

    height: 22px;

    touch-action: none;
}

/* Nen thanh tua (phan chua phat) */
.progress-bar::before {

    content: "";

    position: absolute;

    top: 50%;

    right: 0;

    left: 0;

    height: 5px;

    border-radius: 3px;

    transform: translateY(-50%);

    background: rgba(255, 255, 255, .25);

    pointer-events: none;
}

/* Phan da phat */
.progress-fill {

    position: absolute;

    top: 50%;

    left: 0;

    width: 0;

    height: 5px;

    border-radius: 3px;

    transform: translateY(-50%);

    background: #e50914;

    pointer-events: none;

    transition: width .2s linear;
}

/* Live khong co cua so tua (DVR) -> thanh tua mo di */
.progress-bar.disabled .progress-fill {

    background: #777;
}

.progress-track {

    position: relative;

    width: 100%;

    height: 22px;

    margin: 0;

    background: transparent;

    -webkit-appearance: none;

    appearance: none;

    accent-color: #e50914;

    cursor: pointer;

    touch-action: none;
}

.progress-track:disabled {

    cursor: default;
}

.progress-track::-webkit-slider-runnable-track {

    height: 22px;

    background: transparent;
}

.progress-track::-webkit-slider-thumb {

    width: 16px;

    height: 16px;

    margin-top: 3px;

    border: 2px solid #fff;

    border-radius: 50%;

    background: #e50914;

    box-shadow: 0 0 5px rgba(0, 0, 0, .7);

    -webkit-appearance: none;

    appearance: none;
}

.progress-track::-moz-range-track {

    height: 22px;

    border: 0;

    background: transparent;
}

.progress-track::-moz-range-thumb {

    width: 12px;

    height: 12px;

    border: 2px solid #fff;

    border-radius: 50%;

    background: #e50914;

    box-shadow: 0 0 5px rgba(0, 0, 0, .7);
}

.control-row {

    display: flex;

    align-items: center;

    gap: 7px;

    margin-top: 5px;
}

.player-action,
.speed-select,
.quality-select,
.volume-range {

    height: 30px;

    border: 0;

    border-radius: 6px;

    background: rgba(20, 20, 20, .72);

    color: #ddd;

    padding: 0 9px;

    cursor: pointer;

    font-size: 12px;
}

.player-action:hover,
.speed-select:hover {

    background: rgba(70, 70, 70, .9);
}

.quality-select {

    max-width: 82px;
}

.icon-button {

    width: 32px;

    padding: 0;

    font-size: 16px;
}

.time-label {

    min-width: 82px;

    color: #eee;

    font-size: 11px;

    font-variant-numeric: tabular-nums;
}

.control-spacer {

    flex: 1;
}

.volume-range {

    width: 72px;

    accent-color: #fff;

    cursor: pointer;
}

.player-action.live {

    color: #ff5360;

    font-weight: 700;
}


/* Toan man hinh: khung player phu kin man hinh, bo gioi han 16/9 */
.player-box:fullscreen {

    width: 100vw;

    height: 100vh;

    max-height: none;

    aspect-ratio: auto;
}

.player-box:-webkit-full-screen {

    width: 100vw;

    height: 100vh;

    max-height: none;

    aspect-ratio: auto;
}


/* =====================================================
   INFO
===================================================== */

.info {

    padding:
        15px 20px;

    border-top:
        1px solid #242424;

    background:
        #0d0d0d;
}


.title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 5px;
}


.status {

    color: #999;

    font-size: 13px;
}


/* =====================================================
   SOURCE INFO
===================================================== */

.current-source {

    display: inline-flex;

    align-items: center;

    gap: 7px;

    margin-top: 8px;

    padding:
        5px 9px;

    border-radius: 15px;

    background: #202020;

    color: #bbb;

    font-size: 11px;
}


.current-source img {

    width: 17px;

    height: 17px;

    object-fit: contain;

    border-radius: 4px;
}


/* =====================================================
   BLV
===================================================== */

.blv-panel {

    margin-top: 15px;

    padding-top: 13px;

    border-top:
        1px solid #292929;
}


.blv-label {

    font-size: 12px;

    color: #888;

    margin-bottom: 8px;
}


.blv-buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;
}


.blv-button {

    border:
        1px solid #3a3a3a;

    background: #222;

    color: #ddd;

    padding:
        8px 12px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 12px;
}


.blv-button:hover {

    background: #333;

    border-color: #555;
}


.blv-button.active {

    background:
        #e50914;

    border-color:
        #e50914;

    color: #fff;
}


/* =====================================================
   ERROR
===================================================== */

.error {

    color:
        #ff4545;

    white-space: pre-wrap;

    font-family:
        monospace;

    font-size: 12px;

    margin-top: 10px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    padding:
        30px 10px;

    text-align: center;

    color: #777;

    font-size: 13px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px) {

    body {
        overflow: auto;
        -webkit-tap-highlight-color: transparent;
    }

    .top {
        height: auto;
        min-height: 56px;
        padding: 8px 10px;
        gap: 6px;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .tab {
        flex: 1;
        padding: 12px 8px;
        font-size: 13px;
        border-radius: 8px;
        min-height: 44px;
    }

    .main {
        height: auto;
        min-height: calc(100vh - 56px);
        flex-direction: column;
    }

    .right {
        order: 1;
        overflow: visible;
    }

    .player-box {
        max-height: none;
        aspect-ratio: 16 / 9;
        z-index: 9;
        background: #000;
    }

    .player-actions {
        padding: 16px 8px 8px;
    }

    /* Mot hang duy nhat, khong wrap: thanh tua luon nam ngay tren cum nut
       trong khung player. Cac nut it dung (toc do/chat luong) nam cuoi
       hang, keo ngang de xem. */
    .control-row {
        gap: 6px;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 2px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }

    .control-row::-webkit-scrollbar {
        display: none;
    }

    .control-row > * {
        flex-shrink: 0;
    }

    /* Uu tien: nut chinh luon hien truoc, khong can keo ngang */
    #playButton { order: 1; }
    #rewindButton { order: 2; }
    #forwardButton { order: 3; }
    #timeLabel { order: 4; }
    .control-row > .control-spacer { order: 5; flex: 1 1 0; }
    #muteButton { order: 6; }
    #liveButton { order: 7; }
    #fullscreenButton { order: 8; }
    #speedSelect { order: 9; }
    #qualitySelect { order: 10; }

    .player-action,
    .speed-select,
    .quality-select {
        height: 40px;
        min-width: 40px;
        font-size: 13px;
        border-radius: 8px;
    }

    .icon-button {
        width: 40px;
        min-width: 40px;
        height: 40px;
    }

    .quality-select {
        max-width: 96px;
    }

    /* Vung cham thanh tua cao hon de keo bang ngon tay */
    .progress-bar {
        height: 28px;
    }

    .progress-track {
        height: 28px;
    }

    .progress-track::-webkit-slider-runnable-track {
        height: 28px;
    }

    .progress-track::-webkit-slider-thumb {
        width: 18px;
        height: 18px;
        margin-top: 5px;
    }

    .progress-track::-moz-range-track {
        height: 28px;
    }

    .progress-track::-moz-range-thumb {
        width: 14px;
        height: 14px;
    }

    .left {
        order: 2;
        width: 100%;
        /* Khung danh sach co dinh chieu cao: cuộn bên trong khung,
           trang không dài quá vài trăm kênh. */
        height: calc(100vh - 60px);
        max-height: calc(100vh - 60px);
        overflow-y: auto;
        border-right: 0;
        border-top: 1px solid #303030;
        padding: 10px;
        -webkit-overflow-scrolling: touch;
    }

    .left::-webkit-scrollbar {
        width: 4px;
    }

    .left::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 10px;
    }

    .groups {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 6px;
        -webkit-overflow-scrolling: touch;
    }

    .group {
        flex-shrink: 0;
        padding: 10px 14px;
        font-size: 12px;
        min-height: 40px;
    }

    .match, .channel {
        padding: 14px 12px;
        min-height: 56px;
    }

    /* Danh sách nằm trong khung cuộn riêng, sticky không cần nữa.
       Nhung PHAI giu relative: .player-actions (position:absolute) lay
       .player-box lam goc. Neu de static thi thanh cong cu se "roi"
       xuong day man hinh, de len danh sach kenh -> bam nham play/tua. */
    .player-box {
        position: relative;
    }

    .match-name {
        font-size: 14px;
    }

    .blv-buttons {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 6px;
        -webkit-overflow-scrolling: touch;
    }

    .blv-button {
        flex-shrink: 0;
        padding: 12px 16px;
        min-height: 44px;
        font-size: 13px;
    }

    .info {
        padding: 12px 14px;
    }

    .title {
        font-size: 17px;
        line-height: 1.4;
    }

    .time-label {
        min-width: 64px;
        font-size: 10px;
    }

    .volume-range {
        display: none;
    }

    .speed-select {
        padding: 0 5px;
        font-size: 12px;
    }

}

/* Man hinh rat nho: thu gon kich thuoc nhung KHONG an nut tua/thanh tua */
@media(max-width:400px) {
    .player-actions {
        padding: 14px 6px 6px;
    }

    .control-row {
        gap: 4px;
    }

    .player-action,
    .speed-select,
    .quality-select {
        height: 38px;
        min-width: 38px;
        font-size: 12px;
    }

    .icon-button {
        width: 38px;
        min-width: 38px;
        height: 38px;
    }

    .time-label {
        min-width: 58px;
        font-size: 10px;
    }

    .quality-select {
        max-width: 88px;
    }
}

</style>

</head>


<body>


<!-- ===================================================
     TOP
=================================================== -->

<div class="top">

    <button
        id="footballTab"
        class="tab active"
        onclick="switchMode('football')"
    >
        ⚽ THỂ THAO QUỐC TẾ
    </button>


    <button
        id="vnFootballTab"
        class="tab"
        onclick="switchMode('vnfootball')"
    >
        🇻🇳 BÓNG ĐÁ VN
    </button>

    <button
        id="tvTab"
        class="tab"
        onclick="switchMode('tv')"
    >
        📺 TV
    </button>

</div>


<!-- ===================================================
     MAIN
=================================================== -->

<div class="main">


    <!-- LEFT -->

    <div class="left">

        <div
            id="footballFilters"
            class="football-filters"
        >

            <button
                id="liveFilter"
                class="filter-btn active"
            >
                🔴 ĐANG ĐÁ
            </button>

        </div>


        <!-- SOURCE -->

        <div
            id="groups"
            class="groups"
        ></div>


        <!-- MATCH / TV LIST -->

        <div
            id="list"
        ></div>

    </div>


    <!-- RIGHT -->

    <div class="right">

        <div class="player-box">

            <video
                id="video"
                autoplay
                playsinline
            ></video>

            <div class="player-actions">

                <div
                    id="progressBar"
                    class="progress-bar"
                >

                    <div
                        id="progressFill"
                        class="progress-fill"
                    ></div>

                    <input
                        id="progressTrack"
                        class="progress-track"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        step="0.1"
                        aria-label="Tiến trình phát"
                    >

                </div>

                <div class="control-row">

                    <button
                        id="playButton"
                        class="player-action icon-button"
                        type="button"
                        title="Phát hoặc tạm dừng"
                    >
                        ▶
                    </button>

                <button
                    id="rewindButton"
                    class="player-action icon-button"
                    type="button"
                    title="Tua lui 10 giây"
                >
                    ↶
                </button>

                <button
                    id="forwardButton"
                    class="player-action icon-button"
                    type="button"
                    title="Tua tới 10 giây"
                >
                    ↷
                </button>

                <span
                    id="timeLabel"
                    class="time-label"
                >
                    00:00 / LIVE
                </span>

                <div class="control-spacer"></div>

                <button
                    id="muteButton"
                    class="player-action icon-button"
                    type="button"
                    title="Tắt tiếng"
                >
                    🔊
                </button>

                <input
                    id="volumeRange"
                    class="volume-range"
                    type="range"

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) {
        return "00:00";
    }

    const total = Math.max(0, Math.floor(seconds));
    const minutes = Math.floor(total / 60);
    const remainder = total % 60;

    return String(minutes).padStart(2, "0") +
        ":" +
        String(remainder).padStart(2, "0");
}


// Cua so tua hien tai. VOD: [0, duration]. Live co DVR:
// [seekable.start, seekable.end]. Live khong DVR: hai dau bang nhau.
function getSeekRange() {
    const duration = video.duration;

    if (Number.isFinite(duration) && duration > 0) {
        return {
            start: 0,
            end: duration,
            seekable: true
        };
    }

    try {
        if (video.seekable && video.seekable.length) {
            const last = video.seekable.length - 1;
            const start = video.seekable.start(0);
            const end = video.seekable.end(last);

            return {
                start,
                end,
                seekable: end - start > 1
            };
        }
    } catch {}

    return {
        start: 0,
        end: 0,
        seekable: false
    };
}

function updateVideoControls() {
    const current = video.currentTime;
    const range = getSeekRange();
    const span = range.end - range.start;

    if (range.seekable && span > 0) {
        const percent = Math.min(
            100,
            Math.max(0, ((current - range.start) / span) * 100)
        );

        progressTrack.disabled = false;
        progressBar.classList.remove("disabled");

        // Dang keo tay thi khong ghi de vi tri nguoi dung dang chon.
        if (!progressDragging) {
            progressTrack.value = String(percent);
        }

        progressFill.style.width = percent + "%";

        if (Number.isFinite(video.duration) && video.duration > 0) {
            timeLabel.textContent =
                formatTime(current) +
                " / " +
                formatTime(video.duration);
        } else {
            // Live: hien thi thoi gian tuong doi tu goc cua so tua.
            const relCurrent = current - range.start;

            timeLabel.textContent =
                formatTime(relCurrent > 0 ? relCurrent : 0) + " / LIVE";
        }
    } else {
        // Live khong co cua so tua (DVR): vo hieu thanh tua, chi hien LIVE.
        progressTrack.disabled = true;
        progressBar.classList.add("disabled");
        progressFill.style.width = "0%";
        timeLabel.textContent = "LIVE";
    }

    playButton.textContent = video.paused ? "▶" : "❚❚";
    muteButton.textContent = video.muted ? "🔇" : "🔊";
}


// Voi live (thoi luong vo han) chi duoc tua TRONG cua so seekable.
// Dat currentTime ngoai cua so se bi trinh duyet keo moc ve live -> hien
// tuong video "tu dung"/nhay hinh. Vi vay luon kep moc tua vao cua so hop le.
function clampToSeekable(time) {
    try {
        if (video.seekable && video.seekable.length) {
            let best = null;

            for (let i = 0; i < video.seekable.length; i++) {
                const start = video.seekable.start(i);
                const end = video.seekable.end(i);

                if (time >= start && time <= end) {
                    return time;
                }

                if (
                    best === null ||
                    Math.abs(start - time) < Math.abs(best - time)
                ) {
                    best = start;
                }

                if (Math.abs(end - time) < Math.abs(best - time)) {
                    best = end;
                }
            }

            if (best !== null) {
                return best;
            }
        }
    } catch {}

    return time;
}


function seekTo(time) {
    if (!Number.isFinite(time)) {
        return;
    }

    try {
        video.currentTime = Math.max(0, clampToSeekable(time));
    } catch {}

    updateVideoControls();
}

    const option = document.createElement("option");
    option.value = String(value);

    qualitySelect.appendChild(option);
    qualitySelect.disabled = false;
}


function populateHlsQualities() {
    resetQualityOptions();

    if (!hlsPlayer || !hlsPlayer.levels.length) {
        return;
    }

    try { hlsPlayer.config.capLevelToPlayerSize = false; } catch {}
    try { hlsPlayer.autoLevelCapping = -1; } catch {}

    const levels = hlsPlayer.levels
        .map((level, index) => ({
            index,
            height: level.height || 0,
            bitrate: level.bitrate || 0
        }))
        .sort((a, b) =>
            b.height - a.height ||
            b.bitrate - a.bitrate
        );

    levels.forEach(level => {
            const label = level.height
                ? level.height + "p • " +
                    (level.bitrate / 1000000).toFixed(1) +
                    " Mbps"
                : Math.round(level.bitrate / 1000) + "k";

            addQualityOption("hls:" + level.index, label);
        });

    if (levels.length > 1) {
        addQualityOption("best", "Nét nhất");
    }

    syncHlsQualitySelection();
}


function syncHlsQualitySelection() {
    if (!hlsPlayer) {
        return;
    }

    const cur = hlsPlayer.currentLevel;
    if (cur === -1 || cur === undefined || cur === null) {
        qualitySelect.value = "auto";
        return;
    }
    const manual = "hls:" + cur;
    if ([...qualitySelect.options].some(o => o.value === manual)) {
        qualitySelect.value = manual;
    }
}


function populateShakaQualities() {

    const tracks = [...variantTracks]
        .sort((a, b) =>
            b.height - a.height ||
            b.bandwidth - a.bandwidth

    tracks.forEach(track => {
            const label = track.height + "p • " +
                (track.bandwidth / 1000000).toFixed(1) +
                " Mbps" + (track.audioBandwidth ? " • 🔊" : "");
            addQualityOption("shaka-id:" + track.id, label);
        });

    if (tracks.length > 1) {
        addQualityOption("best", "Nét nhất");
    }
    if (tracks.length <= 1) {
        status.textContent += " • 1 mức chất lượng";
    }
}

// =====================================================
// SHAKA
// =====================================================

async function initPlayer() {

    shaka.polyfill.installAll();

    if (!shaka.Player.isBrowserSupported()) {
        throw new Error(
            "Trình duyệt không hỗ trợ Shaka Player"
        );
    }

    // Nếu còn player cũ thì hủy hoàn toàn
    if (shakaPlayer) {
        try {
            await shakaPlayer.destroy();
        } catch (e) {
            console.warn("Destroy old Shaka:", e);
        }

        shakaPlayer = null;
    }

    // Tạo Shaka mới trực tiếp trên video
    shakaPlayer = new shaka.Player(video);

    shakaPlayer.configure({
        manifest: {
            disableAudio: false,
            retryParameters: {
                maxAttempts: 4,
                baseDelay: 300,
                backoffFactor: 1.5
            }
        },
        streaming: {
            retryParameters: {
                maxAttempts: 5,
                baseDelay: 250,
                backoffFactor: 1.5
            },
            lowLatencyMode: false,
            // Tang buffer de video muot hon, it rebuffer tren mang yeu.
            bufferingGoal: 60,
            rebufferingGoal: 12,
            bufferBehind: 90,
            // Cho Shaka tu phuc hoi MSE khi gap loi decode segment
            // (nhieu kenh DASH live tra segment loi thoang qua).
            allowMediaSourceRecoveries: true,
            minBytesForRecovery: 3000
        }
    });

    shakaPlayer.addEventListener(
        "error",
        e => {

            console.error(
                "SHAKA ERROR:",
                e.detail
            );

            const detail = e.detail || {};

            // 3014: stream loi -> thu khoi phuc lai toan bo.
            if (
                detail.code === 3014 &&
                currentDashUrl &&
                dashRecoveryAttempts < 1
            ) {
                dashRecoveryAttempts++;
                status.textContent =
                    "Đang khôi phục luồng...";
                recoverDashPlayback();
                return;
            }

            // 3016: loi decode (thuong do audio track cua kenh loi).
            // Thu tat audio de video van phat duoc.
            if (
                detail.code === 3016 &&
                shakaPlayer &&
                !shakaPlayer.__audioDisabled
            ) {
                shakaPlayer.__audioDisabled = true;
                try {
                    shakaPlayer.configure({
                        manifest: { disableAudio: true }
                    });
                } catch {}
                status.textContent =
                    "Đang phát (không tiếng)...";
                errorBox.textContent = "";
                return;
            }

            errorBox.textContent =
                "Shaka Error:\n" +
                JSON.stringify(
                    detail,
                    null,
                    2
                );
        }
    );

    return shakaPlayer;
}


async function recoverDashPlayback() {
    if (!shakaPlayer || !currentDashUrl) {
        return;
    }

    try {
        await shakaPlayer.unload();

        await shakaPlayer.load(currentDashUrl);
        populateShakaQualities();
        status.textContent = "🔴 Đang phát";
    } catch (error) {
        console.error("DASH RECOVERY ERROR:", error);
        errorBox.textContent =
            "Không thể khôi phục DASH: " +
            error.message;
    }
}

                        await loadData(true);

                    } catch (e) {

                        console.error(e);
                    }

                },
                1200000
            );
    }
}


// =====================================================
// LOAD DATA
// =====================================================

async function loadData(force = false) {

    // ==================================================
    // CACHE PHIA CLIENT: bam qua lai giua cac tab khong goi lai API.
    // ==================================================
    const cacheKey = mode;
    const cached = playlistCache.get(cacheKey);

    if (
        !force &&
        cached &&
        Date.now() - cached.time < PLAYLIST_CACHE_TIME
    ) {
        applyData(cached.data);
        return;
    }

    // Skeleton: hien ngay cac the xam gia thay vi cho trang.
    list.innerHTML =
        skeletonCards(8);

    groups.innerHTML =
        "";

    try {

        // Nguon chap chon -> thu lai vai lan thay vi bao loi ngay.
        let data = null;
        let lastError = null;

        for (let attempt = 1; attempt <= 3; attempt++) {
            try {
                // Bo cache-bust: de trinh duyet/cache dung du lieu cu,
                // giam request len nguon.
                const response =
                    await fetch(
                        "/api/channels?type=" +
                        encodeURIComponent(
                            mode
                        )
                    );

                if (!response.ok) {
                    throw new Error(
                        "HTTP " + response.status
                    );
                }

                const json = await response.json();

                if (!json.ok) {
                    throw new Error(
                        json.error ||
                        "Không tải được playlist"
                    );
                }

                data = json;
                lastError = null;
                break;

            } catch (e) {
                lastError = e;

                if (attempt < 3) {
                    list.innerHTML =
                        `<div class="empty">Đang thử lại (${attempt}/3)...</div>`;

                    await new Promise(r =>
                        setTimeout(r, 1200 * attempt)
                    );
                }
            }
        }

        if (lastError || !data) {
            // Neu mang loi nhung co cache cu -> dung cache cu.
            if (cached) {
                applyData(cached.data);
                return;
            }

            throw lastError || new Error("Không tải được playlist");
        }

        playlistCache.set(cacheKey, {
            time: Date.now(),
            data
        });


        applyData(data);

    } catch (err) {

        console.error(err);


        list.innerHTML =
            `
            <div
                class="empty"
                style="color:#f44"
            >
                Lỗi tải playlist
                <br><br>
                ${escapeHtml(
                    err.message
                )}
            </div>
                        `;
                }
            }

            // Ap dung du lieu da tai (tu fetch hoac tu cache client) vao UI.
            function applyData(data) {

                if (mode === "football") {

                    allData =
                        data.groups ||
                        [];

                    renderFootball();

                } else if (mode === "vnfootball") {

                    vnSites =
                        data.sites ||
                        [];

                    footballFilters.style.display =
                        "none";

                    renderVnFootball();

                } else {

                    allData =
                        data.channels ||
                        [];

                    footballFilters.style.display =
                        "none";

                    renderTV();
                }
            }

// =====================================================
// OPEN MATCH
// =====================================================

async function openMatch(
    match
) {

    currentMatch =
        match;


    // ==================================================
    // CHỈ LẤY STREAM THUỘC SOURCE ĐANG CHỌN
    // ==================================================

    let channels =
        match.channels ||
        [];


    if (
        currentSource !==
        "Tất cả"
    ) {

        channels =
            channels.filter(
                ch =>
                    String(
                        ch.source ||
                        ""
                    ).trim() ===
                    currentSource
            );
    }


    if (!channels.length) {

        return;
    }


    currentChannel =
        channels[0];


    renderFootball();


    renderBLVButtons(
        channels
    );


    await playFootballChannel(
        currentChannel
    );
}

// =====================================================
// PLAY FOOTBALL
// =====================================================

async function playFootballChannel(
    channel
) {

    errorBox.textContent =
        "";


    title.textContent =
        currentMatch
            ? currentMatch.name
            : "Đang phát";


    status.textContent =
        "Đang mở...";


    showCurrentSource(
        channel
    );


    try {

        const cacheKey =
            "football:" + channel.streamId;

        const cached =
            streamCache.get(cacheKey);

        let result;

        if (
            cached &&
            Date.now() - cached.time <
                STREAM_CACHE_TIME
        ) {
            result = cached.data;
        } else {
            const response =
                await fetch(
                    "/api/football/stream/" +
                    encodeURIComponent(
                        channel.streamId
                    )
                );

            result =
                await response.json();

            if (result.ok) {
                streamCache.set(
                    cacheKey,
                    {
                        time: Date.now(),
                        data: result
                    }
                );
            }
        }


        if (
            !result.ok
        ) {

            throw new Error(
                result.error ||
                "Không lấy được stream"
            );
        }


        await stopPlayer();


        const url =
            result.playUrl ||
            result.url;


        // ==================================================
        // DASH
        // ==================================================

        if (
            isMPD(url) ||
            Object.keys(
                result.clearKeys ||
                {}
            ).length
        ) {

            currentDashUrl = url;
            dashRecoveryAttempts = 0;

            if (
                !shakaPlayer
            ) {

                await initPlayer();
            }


            shakaPlayer.configure({

                drm: {

                    clearKeys:
                        result.clearKeys ||
                        {}
                }
            });


            await shakaPlayer.load(
                url
            );

            populateShakaQualities();


            status.textContent =
                "🔴 Đang phát • " +
                (
                    channel.commentator ||
                    "Kênh thể thao"
                );


            return;
        }


        // ==================================================
        // HLS
        // ==================================================

        if (
            result.kind === "hls" ||
            isHLS(url)
        ) {

            await playHLS(
                url
            );

            return;
        }

        if (
            result.contentType === "video/mp2t" ||
            /\.ts(?:\?|$)/i.test(url)
        ) {
            await playMpegTs(url);
            status.textContent =
                "🔴 Đang phát • " +
                (channel.commentator || "Kênh thể thao");
            return;
        }


        // ==================================================
        // VIDEO
        // ==================================================

        video.src =
            url;


        await video.play();


        status.textContent =
            "🔴 Đang phát • " +
            (
                channel.commentator ||
                "Kênh thể thao"
            );

    } catch (err) {

        console.error(
            "FOOTBALL PLAY ERROR:",
            err
        );


        status.textContent =
            "Không phát được";


        errorBox.textContent =
            err.message ||
            String(err);
    }
}


// =====================================================
// HLS
// =====================================================

async function playHLS(
    url
) {

    /*
     * playHLS() được gọi sau stopPlayer()
     * nên lúc này HLS/Shaka cũ đã được hủy.
     */

    if (
        typeof Hls !== "undefined" &&
        Hls.isSupported()
    ) {

        hlsPlayer =
            new Hls({

                enableWorker:
                    true,

                // Tat lowLatencyMode: LL-HLS buoc phai tai segment nho lien tuc,
                // mang yeu se giut lien tuc. Tueuuan buffer dai hon cho muot.
                lowLatencyMode:
                    false,

                // Giam sync duration de bat dau phat nhanh hon (4 * targetDuration).
                liveSyncDurationCount:
                    4,

                liveMaxLatencyDurationCount:
                    16,

                maxLiveSyncPlaybackRate:
                    1.5,

                backBufferLength:
                    60,

                // Tang buffer toi 60s de video muot hon, khong bi giut khi mang yeu.
                maxBufferLength:
                    60,

                maxBufferSize:
                    90 * 1000 * 1000,

                maxMaxBufferLength:
                    120,

                manifestLoadingMaxRetry:
                    5,

                levelLoadingMaxRetry:
                    5,

                fragLoadingMaxRetry:
                    5,

                fragLoadingMaxRetryTimeout:
                    3000,

                // ABR: bat dau o muc uoc luong ~1.5 Mbps thay vi muc thap nhat
                // -> len nhanh hon, mang yeu van duoc chuan do rebuffer.
                abrEwmaDefaultEstimate: 1500000,

                abrBandWidthFactor: 0.9,

                startLevel: -1
            });


        hlsPlayer.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.error(
                    "HLS ERROR:",
                    data
                );


                if (!data.fatal) {
                    return;
                }


                if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {
                    // Loi manifest/level/fragment mang: bam dau hien tai ->
                    // startLoad() se tai lai tu segment dang dung, khong restart tu dau.
                    try {
                        if (data.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR ||
                            data.details === Hls.ErrorDetails.MANIFEST_LOAD_TIMEOUT) {
                            hlsPlayer.loadSource(hlsPlayer.url);
                        }
                        hlsPlayer.startLoad();
                    } catch {}

                    return;
                }


                if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {
                    // Thu recover media; neu bi gap loi -> append vao hang cho doi.
                    try {
                        hlsPlayer.recoverMediaError();
                    } catch {}

                    return;
                }


                errorBox.textContent =
                    "HLS Error:\n" +
                    JSON.stringify(
                        data,
                        null,
                        2
                    );
            }
        );


        hlsPlayer.on(
            Hls.Events.MANIFEST_PARSED,
            async () => {

                populateHlsQualities();

                try {

                    await video.play();

                    status.textContent =
                        "🔴 Đang phát";

                } catch (e) {

                    console.warn(
                        "Autoplay:",
                        e
                    );
                }
            }
        );


        hlsPlayer.attachMedia(
            video
        );


        hlsPlayer.loadSource(
            url
        );


        return;
    }


    /*
     * Safari / browser có HLS native
     */

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src =
            url;


        await video.play();


        status.textContent =
            "🔴 Đang phát";

        return;
    }


    throw new Error(
        "Trình duyệt không hỗ trợ HLS"
    );
}

let mpegtsRecoverCount = 0;

function playMpegTsOnce(url) {
    mpegtsPlayer = mpegts.createPlayer(
        {
            type: "mpegts",
            url,
            isLive: true
        },
        {
            enableWorker: true,
            enableStashBuffer: false,
            liveBufferLatencyChasing: true,
            liveBufferLatencyMaxLatency: 8,
            liveBufferLatencyMinRemain: 2
        }
    );

    mpegtsPlayer.on(
        mpegts.Events.ERROR,
        (type, detail) => {
            console.error(
                "MPEGTS ERROR:",
                type,
                detail
            );

            if (
                mpegtsPlayer &&
                mpegtsPlayer.mediaSource &&
                video.currentTime > 0
            ) {
                // Lỗi nhẹ, thử tiếp tục tải
                try {
                    mpegtsPlayer.load();
                    mpegtsPlayer.play();
                } catch {}

                return;
            }

            // Lỗi nghiêm trọng: dựng lại player (tối đa 3 lần)
            mpegtsRecoverCount++;

            if (mpegtsRecoverCount > 3) {
                errorBox.textContent =
                    "MPEG-TS Error:\n" +
                    type +
                    " " +
                    (detail?.message || "");
                return;
            }

            const retryUrl = url;

            mpegtsPlayer?.destroy?.().catch?.(() => {});
            mpegtsPlayer = null;

            setTimeout(() => {
                try {
                    playMpegTsOnce(retryUrl);
                    mpegtsPlayer?.play?.();
                } catch {}
            }, 800);
        }
    );

    mpegtsPlayer.attachMediaElement(video);
    mpegtsPlayer.load();
    mpegtsPlayer.play();
}

async function playMpegTs(url) {
    if (
        typeof mpegts === "undefined" ||
        !mpegts.isSupported()
    ) {
        throw new Error(
            "Trình duyệt chưa hỗ trợ MPEG-TS"
        );
    }

    mpegtsRecoverCount = 0;
        
    playMpegTsOnce(url);
}

async function playVnMatch(match) {

    currentVnMatch =
        match;

    // Render panel (doi luong/BLV) TRUOC khi bat dau phat de nguoi
    // dung thay ngay danh sach luong, khong phai cho player resolve.
    renderVnFootball();

        match.streams.length

        await playVnStream(
            match.streams[0]

        renderVnFootball();
    }
}

// Phát 1 luồng (BLV) cụ thể của trận đang chọn.
async function playVnStream(stream) {

    const channel = {

        name:
            (currentVnMatch && currentVnMatch.title
                ? currentVnMatch.title
                : "Trận đấu") +
            " (" + stream.name + ")",

        logo:
            currentVnMatch && currentVnMatch.logo
                ? currentVnMatch.logo
                : "",

        group:
            currentVnSite || "",

        url:
            stream.url,

        headers:
            stream.headers || {},

        clearKeys:
            stream.clearKeys || {}
    };

    currentChannel =
        channel;

    await playTV(
        channel
    );
}

// =====================================================
// TV PLAY
// =====================================================

async function playTV(channel) {

    errorBox.textContent = "";

    hideBlv();

    currentSourceBox.style.display = "none";

    title.textContent =
        channel.name || "Đang phát";

    status.textContent = "Đang mở...";

    try {

        console.log("================================");
        console.log("TV PLAY START");
        console.log("CHANNEL:", channel.name);
        console.log("SOURCE URL:", channel.url);

        const cacheKey =
            "tv:" + channel.url;

        const cached =
            streamCache.get(cacheKey);

        let result;

        if (
            cached &&
            Date.now() - cached.time <
                STREAM_CACHE_TIME
        ) {
            result = cached.data;
        } else {
            // Nguon (livesport, tv360, vtvprime...) chap chon: co luc
            // 502/404/network loi -> tu thu lai vai lan truoc khi bao loi.
            const RESOLVE_ATTEMPTS = 3;

            let lastError = null;

            for (let attempt = 1; attempt <= RESOLVE_ATTEMPTS; attempt++) {
                try {

                    const response = await fetch(
                        "/api/resolve?url=" +
                        encodeURIComponent(channel.url)
                    );

                    console.log(
                        "RESOLVE HTTP:",
                        response.status,
                        "(lan " + attempt + ")"
                    );

                    if (!response.ok) {
                        throw new Error(
                            "Resolve HTTP " +
                            response.status
                        );
                    }

                    result = await response.json();

                    if (!result.ok) {
                        throw new Error(
                            result.error ||
                            "Resolve failed"
                        );
                    }

                    streamCache.set(
                        cacheKey,
                        {
                            time: Date.now(),
                            data: result
                        }
                    );

                    lastError = null;
                    break;

                } catch (e) {

                    lastError = e;

                    if (attempt < RESOLVE_ATTEMPTS) {
                        status.textContent =
                            "Đang thử lại (" + attempt + "/" + RESOLVE_ATTEMPTS + ")...";

                        await new Promise(r =>
                            setTimeout(r, 1200 * attempt)
                        );
                    }
                }
            }

            if (lastError) {
                throw lastError;
            }
        }

        console.log("RESOLVE RESULT:", result);

        if (!result.ok) {
            throw new Error(
                result.error ||
                "Resolve failed"
            );
        }

        await stopPlayer();

        const url =
            result.playUrl ||
            result.finalUrl ||
            result.url ||
            channel.url;

        const clearKeys =
            result.clearKeys || {};

        console.log("PLAY URL:", url);
        console.log("KIND:", result.kind);
        console.log("CLEARKEYS:", clearKeys);
        console.log(
            "CLEARKEY COUNT:",
            Object.keys(clearKeys).length
        );

        // ==============================
        // HLS
        // ==============================

        if (
            result.kind === "hls" ||
            isHLS(url)
        ) {

            console.log(
                "TV PLAY TYPE: HLS"
            );

            await playHLS(url);

            status.textContent =
                "🔴 Đang phát";

            return;
        }

        if (
            result.contentType === "video/mp2t" ||
            /\.ts(?:\?|$)/i.test(url)
        ) {
            await playMpegTs(url);
            status.textContent = "🔴 Đang phát";
            return;
        }

        // ==============================
        // DASH
        // ==============================

        if (
            result.kind === "dash" ||
            isMPD(url)
        ) {

            currentDashUrl = url;
            dashRecoveryAttempts = 0;

            console.log(
                "TV PLAY TYPE: DASH"
            );

            await initPlayer();

            // Cấu hình ClearKey TRƯỚC khi load MPD để Shaka đọc
            // DRM config ngay tại thời điểm load() — choantuoi
            // nếu để sau thì Shaka có thể đãGc/clear config cũ.
            if (
                Object.keys(clearKeys).length > 0
            ) {

                console.log(
                    "CONFIG CLEARKEY"
                );

                await shakaPlayer.configure({
                    drm: {
                        clearKeys:
                            clearKeys
                    }
                });
            }

            console.log(
                "SHAKA LOAD:",
                url
            );

            await shakaPlayer.load(url);

            populateShakaQualities();

            console.log(
                "SHAKA LOAD SUCCESS"
            );

            status.textContent =
                "🔴 Đang phát";

            return;
        }

        // ==============================
        // DIRECT VIDEO
        // ==============================

        console.log(
            "TV PLAY TYPE: DIRECT VIDEO"
        );

        video.src = url;

        await video.play();

        status.textContent =
            "🔴 Đang phát";

    } catch (err) {

        console.error(
            "================================"
        );

        console.error(
            "TV PLAY ERROR:",
            err
        );

        console.error(
            "NAME:",
            err?.name
        );

        console.error(
            "MESSAGE:",
            err?.message
        );

        console.error(
            "STACK:",
            err?.stack
        );

        console.error(
            "================================"
        );

        status.textContent =
            "Không phát được";

        errorBox.textContent =
            (err?.message || String(err));
    }
}

// =====================================================
// STOP
// =====================================================

async function stopPlayer() {

    if (mpegtsPlayer) {
        try {
            mpegtsPlayer.pause();
            mpegtsPlayer.unload();
            mpegtsPlayer.detachMediaElement();
            mpegtsPlayer.destroy();
        } catch (e) {
            console.warn("MPEG-TS destroy error:", e);
        }

        mpegtsPlayer = null;
    }


    resetQualityOptions();

    // ==============================
    // HỦY HLS
    // ==============================

    if (hlsPlayer) {

        try {
            await hlsPlayer.destroy();
        } catch (e) {
            console.warn(
                "HLS destroy error:",
                e
            );
        }

        hlsPlayer = null;
    }


    // ==============================
    // HỦY SHAKA HOÀN TOÀN
    // ==============================

    if (shakaPlayer) {

        try {
            await shakaPlayer.destroy();
        } catch (e) {
            console.warn(
                "Shaka destroy error:",
                e
            );
        }

        shakaPlayer = null;
    }


    // ==============================
    // RESET VIDEO
    // ==============================

    try {
        video.pause();
    } catch {}


    video.removeAttribute("src");

    video.load();
}


// =====================================================
// TYPE
// =====================================================

function isMPD(
    url
) {

    const u =
        String(url || "");


    return (
        /\.mpd(?:\?|$)/i.test(u) ||
        /manifest\.mpd/i.test(u)
    );
}


function isHLS(
    url
) {

    const u =
        String(url || "");


    return (
        /\.m3u8(?:\?|$)/i.test(u) ||
        /m3u8/i.test(u)
    );
}

// =====================================================
// LOGO HELPER
// =====================================================
// lazy + no-referrer: tranh logo ben ngoai chan load/chan render,
// va tu an khi loi (nhieu logo nguon khong cho hot-link).

// =====================================================
// RENDER THEO LO (CHUNKED)
// =====================================================
// Chen tung lo phan tu vao container thay vi chen het mot lan.
// Voi 500+ kenh, chen het mot lan se block UI vai giay -> treo.
// Dung requestAnimationFrame giua cac lo de giu UI muot.

const RENDER_CHUNK_SIZE = 40;

function renderChunked(items, createElement, container) {

    let index = 0;

    // Huy render cu neu nguoi dung doi tab giua chung.
    const token = ++renderChunked.token;

    function step() {

        if (token !== renderChunked.token) {
            return;
        }

        const end = Math.min(
            index + RENDER_CHUNK_SIZE,
            items.length
        );

        const frag = document.createDocumentFragment();

        for (; index < end; index++) {

            const el = createElement(items[index], index);

            if (el) {
                frag.appendChild(el);
            }
        }

        container.appendChild(frag);

        if (index < items.length) {
            requestAnimationFrame(step);
        }
    }

    requestAnimationFrame(step);
}

renderChunked.token = 0;

// Skeleton card (the xam gia) hien khi dang tai.
function skeletonCards(count = 8) {

    let html = "";

    for (let i = 0; i < count; i++) {
        html +=
            '<div class="channel skeleton">' +
            '<div class="sk-logo"></div>' +
            '<div class="sk-line"></div>' +
            '</div>';
    }

    return html;
}

function setupLogoImg(img, src) {

    img.loading = "lazy";

    img.referrerPolicy = "no-referrer";

    img.src = src;

    img.onerror = () => {

        img.style.display = "none";
    };
}

// =====================================================
// ESCAPE
// =====================================================

function escapeHtml(
    text
) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}
