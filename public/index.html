<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#0a0c10"
>

<title>TV360 WEB PLAYER</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.16.2/shaka-player.compiled.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.min.js"></script>


<style>
/* ==========================================================
   TV360 WEB PLAYER - GIAO DIEN 2026 (PC + Mobile)
   ========================================================== */
:root {
    --bg: #0a0c10;
    --panel: #12151d;
    --panel-2: #171b26;
    --card: #151923;
    --border: rgba(255, 255, 255, .07);
    --border-2: rgba(255, 255, 255, .12);
    --text: #f2f4f8;
    --text-dim: #9aa3b2;
    --text-mute: #6b7383;
    --accent: #ff2b3d;
    --accent-2: #d90d20;
    --accent-soft: rgba(255, 43, 61, .14);
    --radius: 14px;
    --radius-s: 10px;
    --top-h: 60px;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background:
        radial-gradient(1200px 500px at 80% -10%, rgba(255, 43, 61, .08), transparent 60%),
        var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    /* Ngăn chọn văn bản khi bấm nhanh nhiều lần */
    user-select: none;
    -webkit-user-select: none;
}

button, input, select {
    font-family: inherit;
}

::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, .14);
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, .22);
}

/* =====================================================
   TOP BAR + TABS
===================================================== */

.top {
    height: var(--top-h);
    background: rgba(15, 18, 26, .92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    padding: 8px 16px;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    z-index: 30;
}

.brand {
    display: flex;
    align-items: center;
    gap: 9px;
    user-select: none;
    margin-right: 6px;
}

.brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #ff4d5e, #b00b18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    box-shadow: 0 4px 14px rgba(255, 43, 61, .35);
}

.brand-name {
    font-weight: 800;
    font-size: 16px;
    letter-spacing: .4px;
    white-space: nowrap;
}

.brand-name span {
    color: var(--accent);
}

.tabs {
    display: flex;
    gap: 6px;
    background: rgba(255, 255, 255, .05);
    border: 1px solid var(--border);
    padding: 4px;
    border-radius: 12px;
}

.tab {
    border: 0;
    padding: 9px 18px;
    border-radius: 9px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    transition: background .15s, color .15s;
    white-space: nowrap;
}

.tab:hover {
    color: var(--text);
    background: rgba(255, 255, 255, .06);
}

.tab.active {
    background: linear-gradient(135deg, #ff4d5e, #d90d20);
    color: #fff;
    box-shadow: 0 3px 12px rgba(255, 43, 61, .35);
}

/* =====================================================
   MAIN LAYOUT
===================================================== */

.main {
    height: calc(100vh - var(--top-h));
    display: flex;
}

/* =====================================================
   LEFT: DANH SACH
===================================================== */

.left {
    width: 400px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 14px;
}

.left::-webkit-scrollbar {
    width: 6px;
}

.left::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, .12);
}

/* Filter hang (legacy football) */
.football-filters {
    display: flex;
    gap: 7px;
    margin-bottom: 12px;
}

.filter-btn {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 12px;
    background: var(--panel-2);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
}

.filter-btn.active {
    background: var(--accent-soft);
    border-color: rgba(255, 43, 61, .4);
    color: #ff8a94;
}

/* Nguon (chips) */
.groups {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 14px;
}

.group {
    background: rgba(255, 255, 255, .05);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 18px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .15s, color .15s, border-color .15s, transform .1s;
}

.group:hover {
    background: rgba(255, 255, 255, .1);
    color: var(--text);
    transform: translateY(-1px);
}

.group.active {
    background: linear-gradient(135deg, #ff4d5e, #d90d20);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 3px 10px rgba(255, 43, 61, .3);
}

.source-logo {
    width: 18px;
    height: 18px;
    object-fit: contain;
    border-radius: 4px;
}

/* Card tran (football quoc te - legacy) */
.match {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .12s;
}

.match:hover {
    background: #1a1f2c;
    border-color: var(--border-2);
    transform: translateY(-1px);
}

.match.selected {
    border-color: rgba(255, 43, 61, .65);
    background: #1a1620;
    box-shadow: 0 0 0 1px rgba(255, 43, 61, .25), 0 6px 18px rgba(255, 43, 61, .08);
}

.match-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}

.match-time {
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
}

.live-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: #ff5563;
    font-size: 11px;
    font-weight: 800;
}

.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: livePulse 1.6s ease-in-out infinite;
}

@keyframes livePulse {

    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
}

.match-name {
    font-size: 15.5px;
    line-height: 1.4;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 9px;
}

.match-source {
    color: var(--text-mute);
    font-size: 11.5px;
    margin-bottom: 9px;
}

.match-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text-mute);
    font-size: 11.5px;
}

.match-blv-count {
    color: var(--text-dim);
}

.watch-text {
    color: var(--accent);
    font-weight: 800;
}

/* Card tran (bong da VN) */
.vn-match-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .12s;
}

.vn-match-card:hover {
    background: #1a1f2c;
    border-color: var(--border-2);
    transform: translateY(-1px);
}

.vn-match-card.selected {
    border-color: rgba(255, 43, 61, .65);
    background: #1a1620;
}

.vn-match-logo {
    width: 46px;
    height: 46px;
    object-fit: contain;
    background: rgba(255, 255, 255, .05);
    border-radius: 10px;
    flex-shrink: 0;
    padding: 4px;
}

.vn-match-body {
    min-width: 0;
    flex: 1;
}

.vn-match-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 5px;
}

.vn-match-time {
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
}

.vn-match-title {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
}

.vn-match-foot {
    margin-top: 6px;
    color: var(--text-mute);
    font-size: 11.5px;
}

/* Kenh TV */
.channel {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    margin-bottom: 6px;
    border-radius: var(--radius-s);
    cursor: pointer;
    background: var(--card);
    border: 1px solid var(--border);
    transition: background .15s, border-color .15s;
}

.channel:hover {
    background: #1c212e;
    border-color: var(--border-2);
}

.logo {
    width: 40px;
    height: 40px;
    object-fit: contain;
    background: rgba(255, 255, 255, .05);
    border-radius: 9px;
    padding: 3px;
    flex-shrink: 0;
}

.logo-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    font-weight: 800;
    font-size: 17px;
    color: #fff;
    background: linear-gradient(135deg, #ff4d5e, #8e0d18);
    border-radius: 9px;
}

.channel-name {
    font-size: 13.5px;
    font-weight: 600;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* Skeleton */
.skeleton {
    pointer-events: none;
}

.sk-logo {
    width: 40px;
    height: 40px;
    border-radius: 9px;
    flex-shrink: 0;
    background: rgba(255, 255, 255, .07);
    animation: sk-pulse 1.4s ease-in-out infinite;
}

.sk-line {
    height: 13px;
    flex: 1;
    max-width: 60%;
    border-radius: 5px;
    background: rgba(255, 255, 255, .07);
    animation: sk-pulse 1.4s ease-in-out infinite;
}

@keyframes sk-pulse {

    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
}

/* =====================================================
   RIGHT + PLAYER
===================================================== */

.right {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
}

.player-box {
    width: 100%;
    background: #000;
    position: relative;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    /* Giữ tỉ lệ 16:9 mặc định nhưng cho phép thay đổi */
    aspect-ratio: 16 / 9;
}

.video-wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}

video {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    object-fit: contain; /* Đảm bảo không bị dải đen nếu khung bọc vừa khít */
}

.player-actions {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 2;
    padding: 34px 12px 10px;
    background: linear-gradient(transparent, rgba(5, 6, 10, .82));
    transition: opacity .25s ease, visibility .25s ease;
}

/* Tu dong an thanh dieu khien khi dang phat + khong tuong tac */
.player-box.controls-hidden .player-actions {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.player-box.controls-hidden {
    cursor: none;
}

.progress-bar {
    position: relative;
    height: 22px;
    margin-bottom: 4px;
}

.progress-fill {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, #ff4d5e, #d90d20);
    pointer-events: none;
    z-index: 1;
}

.progress-track {
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    display: block;
    box-sizing: border-box;
    width: 100%;
    height: 22px;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    accent-color: var(--accent);
    cursor: pointer;
    touch-action: none;
}

.progress-track:disabled {
    cursor: default;
}

.progress-track::-webkit-slider-runnable-track {
    height: 22px;
    margin: 0;
    padding: 0;
    background: transparent;
}

.progress-track::-webkit-slider-thumb {
    width: 14px;
    height: 14px;
    margin-top: 4px;
    border: 2px solid #fff;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 5px rgba(0, 0, 0, .7);
    -webkit-appearance: none;
    appearance: none;
}

.progress-track::-moz-range-track {
    height: 22px;
    border: 0;
    background: transparent;
}

.progress-track::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: 2px solid #fff;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 5px rgba(0, 0, 0, .7);
}

.control-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-width: 0;
    margin: 0;
    padding: 0;
}

.player-action,
.speed-select,
.quality-select {
    flex-shrink: 0;
    height: 32px;
    border: 0;
    border-radius: 9px;
    background: rgba(22, 26, 36, .78);
    color: #dfe3ea;
    padding: 0 10px;
    cursor: pointer;
    font-size: 12px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background .15s;
}

.player-action:hover,
.speed-select:hover {
    background: rgba(58, 66, 84, .95);
}

.quality-select {
    max-width: 82px;
}

.icon-button {
    width: 34px;
    min-width: 34px;
    padding: 0;
    font-size: 16px;
}

.time-label {
    flex-shrink: 0;
    min-width: 0;
    color: #e8ebf2;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}

.control-spacer {
    flex: 1 1 auto;
    min-width: 4px;
}

/* Cum am luong */
.volume-group {
    position: relative;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    gap: 0;
    height: 32px;
    border-radius: 9px;
    background: rgba(22, 26, 36, .78);
    padding: 0 8px 0 2px;
}

.volume-group .player-action {
    background: transparent;
    height: 30px;
}

.volume-range {
    display: block;
    box-sizing: border-box;
    width: 64px;
    height: 20px;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    accent-color: #fff;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
}

.volume-range::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, .35);
}

.volume-range::-webkit-slider-thumb {
    width: 12px;
    height: 12px;
    margin-top: -4px;
    border: 0;
    border-radius: 50%;
    background: #fff;
    -webkit-appearance: none;
    appearance: none;
}

.volume-range::-moz-range-track {
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, .35);
}

.volume-range::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: 0;
    border-radius: 50%;
    background: #fff;
}

.player-action.live {
    color: #ff5360;
    font-weight: 800;
}

/* Toan man hinh */
.player-box:fullscreen {
    width: 100vw;
    height: 100vh;
    max-height: none;
    aspect-ratio: auto;
}

.player-box:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
    max-height: none;
    aspect-ratio: auto;
}

/* =====================================================
   INFO + BLV + ERROR
===================================================== */

.info {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
}

.title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 5px;
    line-height: 1.35;
}

.status {
    color: var(--text-dim);
    font-size: 13px;
}

.current-source {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 9px;
    padding: 6px 11px;
    border-radius: 16px;
    background: rgba(255, 255, 255, .06);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 11.5px;
    font-weight: 600;
}

.current-source img {
    width: 17px;
    height: 17px;
    object-fit: contain;
    border-radius: 4px;
}

.blv-panel {
    margin-top: 15px;
    padding-top: 13px;
    border-top: 1px solid var(--border);
}

.blv-label {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 700;
    margin-bottom: 8px;
}

.blv-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.blv-button {
    border: 1px solid var(--border-2);
    background: var(--panel-2);
    color: #dfe3ea;
    padding: 9px 13px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: background .15s, border-color .15s;
}

.blv-button:hover {
    background: #242a38;
    border-color: rgba(255, 255, 255, .22);
}

.blv-button.active {
    background: linear-gradient(135deg, #ff4d5e, #d90d20);
    border-color: transparent;
    color: #fff;
}

.error {
    color: #ff5a64;
    white-space: pre-wrap;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    margin-top: 10px;
}

.empty {
    padding: 34px 10px;
    text-align: center;
    color: var(--text-mute);
    font-size: 13px;
}

/* =====================================================
   CHAT CHUNG
===================================================== */

.chat-fab {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 60;
    width: 54px;
    height: 54px;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    font-size: 23px;
    color: #fff;
    background: linear-gradient(135deg, #ff4d5e, #b00b18);
    box-shadow: 0 8px 24px rgba(255, 43, 61, .4);
    transition: transform .15s;
}

.chat-fab:hover {
    transform: scale(1.06);
}

.chat-panel {
    position: fixed;
    right: 18px;
    bottom: 84px;
    z-index: 61;
    width: 340px;
    height: min(480px, calc(100vh - 170px));
    display: none;
    flex-direction: column;
    background: rgba(17, 20, 30, .97);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-2);
    border-radius: 16px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
    overflow: hidden;
}

.chat-panel.open {
    display: flex;
}

.chat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, .03);
}

.chat-head-title {
    font-weight: 800;
    font-size: 14px;
}

.chat-head-title small {
    display: block;
    color: var(--text-mute);
    font-weight: 500;
    font-size: 10.5px;
    margin-top: 2px;
}

#chatNameInput {
    width: 110px;
    background: rgba(255, 255, 255, .06);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 11.5px;
    outline: none;
}

#chatNameInput:focus {
    border-color: rgba(255, 43, 61, .5);
}

.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.chat-msg {
    max-width: 88%;
    background: rgba(255, 255, 255, .06);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 7px 11px;
    font-size: 13px;
    line-height: 1.45;
    word-break: break-word;
}

.chat-msg b {
    display: block;
    font-size: 11px;
    color: #ff8a94;
    margin-bottom: 2px;
}

.chat-msg.self {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(255, 77, 94, .25), rgba(217, 13, 32, .18));
    border-color: rgba(255, 43, 61, .35);
}

.chat-msg.self b {
    color: #ffb3ba;
}

.chat-empty {
    color: var(--text-mute);
    font-size: 12px;
    text-align: center;
    padding: 18px 8px;
}

.chat-form {
    display: flex;
    gap: 8px;
    padding: 10px;

<script>

let mode = "vnfootball";

// Tran dang phat trong tab Bong da VN (de chon doi luong)
let currentVnMatch = null;

let shakaPlayer = null;

let currentDashUrl = "";

let dashRecoveryAttempts = 0;

let hlsPlayer = null;

let mpegtsPlayer = null;

let footballRefreshTimer = null;

const streamCache = new Map();

const STREAM_CACHE_TIME = 2 * 60 * 1000;

// Cache du lieu playlist theo mode o phia client.
// Muc dich: khi nguoi dung bam qua lai giua 3 tab, khong goi lai
// /api/channels lien tuc -> giam tai nguon & tang toc do.
const playlistCache = new Map();

const PLAYLIST_CACHE_TIME = 15 * 60 * 1000;


// =====================================================
// DOM
// =====================================================

const video =
    document.getElementById(
        "video"
    );


const list =
    document.getElementById(

const groups =

const blvButtons =

    );


const footballFilters =
    document.getElementById(
        "footballFilters"
    );


const currentSourceBox =
    document.getElementById(
        "currentSource"
    );


const rewindButton =
    document.getElementById(
        "rewindButton"
    );


const forwardButton =
    document.getElementById(
        "forwardButton"
    );


const liveButton =
    document.getElementById(
        "liveButton"
    );


const speedSelect =
    document.getElementById(
        "speedSelect"
    );


const progressTrack =
    document.getElementById(
        "progressTrack"
    );


const progressBar =
    document.getElementById(
        "progressBar"

const progressFill =
    document.getElementById(
        "progressFill"

const playButton =
    document.getElementById(
        "playButton"
    );


const muteButton =
    document.getElementById(

const volumeRange =
    document.getElementById(
        "volumeRange"

const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );


const qualitySelect =
    document.getElementById(
        "qualitySelect"

const timeLabel =
    document.getElementById(
        "timeLabel"

const playerBox =
    document.querySelector(
        ".player-box"
    );


let controlsHideTimer = null;

let progressDragging = false;


function showPlayerControls() {
    playerBox.classList.remove(
        "controls-hidden"
    );

    clearTimeout(controlsHideTimer);

    if (!video.paused && !progressDragging) {
        controlsHideTimer = setTimeout(
            () => playerBox.classList.add("controls-hidden"),
            3500
        );
    }
}


function hidePlayerControlsSoon() {
    clearTimeout(controlsHideTimer);

    if (!video.paused && !progressDragging) {
        controlsHideTimer = setTimeout(
            () => {
                playerBox.classList.add("controls-hidden");
                closeVolumePopup();
            },
            3500
        );
    }
}


playerBox.addEventListener(
    "mousemove",
    showPlayerControls
);


playerBox.addEventListener(
    "touchstart",
    showPlayerControls,
    { passive: true }
);


playerBox.addEventListener(
    "mouseleave",
    hidePlayerControlsSoon
);


playerBox.querySelector(
    ".player-actions"
).addEventListener(
    "mouseenter",
    () => clearTimeout(controlsHideTimer)
);


playerBox.querySelector(
    ".player-actions"
).addEventListener(
    "mouseleave",
    hidePlayerControlsSoon
);


function formatTime(seconds) {
    if (!Number.isFinite(seconds)) {
        return "00:00";
    }

    const total = Math.max(0, Math.floor(seconds));
    const minutes = Math.floor(total / 60);
    const remainder = total % 60;

    return String(minutes).padStart(2, "0") +
        ":" +
        String(remainder).padStart(2, "0");
}


// Cua so tua hien tai. VOD: [0, duration]. Live co DVR:
// [seekable.start, seekable.end]. Live khong DVR: hai dau bang nhau.
function getSeekRange() {
    const duration = video.duration;

    if (Number.isFinite(duration) && duration > 0) {
        return {
            start: 0,
            end: duration,
            seekable: true
        };
    }

    try {
        if (video.seekable && video.seekable.length) {
            const last = video.seekable.length - 1;
            const start = video.seekable.start(0);
            const end = video.seekable.end(last);

            return {
                start,
                end,
                seekable: end - start > 1
            };
        }
    } catch {}

    return {
        start: 0,
        end: 0,
        seekable: false
    };
}

function updateVideoControls() {
    const current = video.currentTime;
    const range = getSeekRange();
    const span = range.end - range.start;

    if (range.seekable && span > 0) {
        const percent = Math.min(
            100,
            Math.max(0, ((current - range.start) / span) * 100)
        );

        progressTrack.disabled = false;
        progressBar.classList.remove("disabled");

        // Dang keo tay thi khong ghi de vi tri nguoi dung dang chon.
        if (!progressDragging) {
            progressTrack.value = String(percent);
        }

        progressFill.style.width = percent + "%";

        if (Number.isFinite(video.duration) && video.duration > 0) {
            timeLabel.textContent =
                formatTime(current) +
                " / " +
                formatTime(video.duration);
        } else {
            // Live: hien thi thoi gian tuong doi tu goc cua so tua.
            const relCurrent = current - range.start;

            timeLabel.textContent =
                formatTime(relCurrent > 0 ? relCurrent : 0) + " / LIVE";
        }
    } else {
        // Live khong co cua so tua (DVR): vo hieu thanh tua, chi hien LIVE.
        progressTrack.disabled = true;
        progressBar.classList.add("disabled");
        progressFill.style.width = "0%";
        timeLabel.textContent = "LIVE";
    }

    playButton.textContent = video.paused ? "▶" : "❚❚";
    muteButton.textContent = video.muted ? "🔇" : "🔊";
}


// Voi live (thoi luong vo han) chi duoc tua TRONG cua so seekable.
// Dat currentTime ngoai cua so se bi trinh duyet keo moc ve live -> hien
// tuong video "tu dung"/nhay hinh. Vi vay luon kep moc tua vao cua so hop le.
function clampToSeekable(time) {
    try {
        if (video.seekable && video.seekable.length) {
            let best = null;

            for (let i = 0; i < video.seekable.length; i++) {
                const start = video.seekable.start(i);
                const end = video.seekable.end(i);

                if (time >= start && time <= end) {
                    return time;
                }

                if (
                    best === null ||
                    Math.abs(start - time) < Math.abs(best - time)
                ) {
                    best = start;
                }

                if (Math.abs(end - time) < Math.abs(best - time)) {
                    best = end;
                }
            }

            if (best !== null) {
                return best;
            }
        }
    } catch {}

    return time;
}


function seekTo(time) {
    if (!Number.isFinite(time)) {
        return;
    }

    try {
        video.currentTime = Math.max(0, clampToSeekable(time));
    } catch {}

    updateVideoControls();
}


function resetQualityOptions() {
    qualitySelect.innerHTML =
        '<option value="auto">Auto</option>';
    qualitySelect.value = "auto";
    qualitySelect.disabled = true;
}


function addQualityOption(value, label) {
    if (
        [...qualitySelect.options]
            .some(option => option.value === String(value))
    ) {
        return;
    }

    const option = document.createElement("option");
    option.value = String(value);
    option.textContent = label;
    qualitySelect.appendChild(option);
    qualitySelect.disabled = false;
}


function populateHlsQualities() {
    resetQualityOptions();

    if (!hlsPlayer || !hlsPlayer.levels.length) {
        return;
    }

    try { hlsPlayer.config.capLevelToPlayerSize = false; } catch {}
    try { hlsPlayer.autoLevelCapping = -1; } catch {}

    const levels = hlsPlayer.levels
        .map((level, index) => ({
            index,
            height: level.height || 0,
            bitrate: level.bitrate || 0
        }))
        .sort((a, b) =>
            b.height - a.height ||
            b.bitrate - a.bitrate
        );

    levels.forEach(level => {
            const label = level.height
                ? level.height + "p • " +
                    (level.bitrate / 1000000).toFixed(1) +
                    " Mbps"
                : Math.round(level.bitrate / 1000) + "k";

            addQualityOption("hls:" + level.index, label);
        });

    if (levels.length > 1) {
        addQualityOption("best", "Nét nhất");
    }

    syncHlsQualitySelection();
}


function syncHlsQualitySelection() {
    if (!hlsPlayer) {
        return;
    }

    const cur = hlsPlayer.currentLevel;
    if (cur === -1 || cur === undefined || cur === null) {
        qualitySelect.value = "auto";
        return;
    }
    const manual = "hls:" + cur;
    if ([...qualitySelect.options].some(o => o.value === manual)) {
        qualitySelect.value = manual;
    }
}


function populateShakaQualities() {
    resetQualityOptions();

    if (!shakaPlayer) {
        return;
    }

    const variantTracks = shakaPlayer
        .getVariantTracks()
        .filter(track => track.height);

    const tracks = [...variantTracks]
        .sort((a, b) =>
            b.height - a.height ||
            b.bandwidth - a.bandwidth
        );

    tracks.forEach(track => {
            const label = track.height + "p • " +
                (track.bandwidth / 1000000).toFixed(1) +
                " Mbps" + (track.audioBandwidth ? " • 🔊" : "");
            addQualityOption("shaka-id:" + track.id, label);
        });

    if (tracks.length > 1) {
        addQualityOption("best", "Nét nhất");
    }
    if (tracks.length <= 1) {
        status.textContent += " • 1 mức chất lượng";
    }
}


function findBestShakaTrack() {
    if (!shakaPlayer) {
        return null;
    }

    return shakaPlayer
        .getVariantTracks()
        .filter(track => track.height)
        .sort((a, b) =>
            b.height - a.height ||
            b.bandwidth - a.bandwidth
        )[0] || null;
}


function selectShakaTrack(track) {
    if (!shakaPlayer || !track) {
        return;
    }

    shakaPlayer.configure({
        abr: {
            enabled: false
        }
    });

    shakaPlayer.selectVariantTrack(
        track,
        true
    );
}


progressTrack.oninput =
    () => {
        progressDragging = true;
        showPlayerControls();

        const range = getSeekRange();

        if (!range.seekable) {
            return;
        }

        // Chua tua duoc (live khong co DVR) -> thanh tua dung yen.
        const percent = Number(progressTrack.value);

        progressFill.style.width = percent + "%";

        seekTo(
            range.start +
            (range.end - range.start) * percent / 100
        );

        if (value === "best") {
            if (hlsPlayer) {
                const best = hlsPlayer.levels
                    .map((level, index) => ({
                        index,
                        height: level.height || 0,
                        bitrate: level.bitrate || 0
                    }))
                    .sort((a, b) =>
                        b.height - a.height ||
                        b.bitrate - a.bitrate
                    )[0];

                if (best) {
                    try { hlsPlayer.autoLevelCapping = -1; } catch {}
                    hlsPlayer.nextLevel = best.index;
                    hlsPlayer.currentLevel = best.index;
                    try { hlsPlayer.loadLevel = best.index; } catch {}
                    qualitySelect.value = "best";
                    status.textContent = "🔴 Đang phát • khóa " + (best.height ? best.height + "p" : "nét nhất");
                }

            if (shakaPlayer) {
                const bestTrack = findBestShakaTrack();
                selectShakaTrack(bestTrack);
                if (bestTrack) {
                    qualitySelect.value = "best";
                    status.textContent = "🔴 Đang phát • khóa " + bestTrack.height + "p";
                }
            }

            return;
        }

        if (
            value.startsWith("shaka-id:") &&
            shakaPlayer
        ) {
            const id = Number(value.slice("shaka-id:".length));
            const track = shakaPlayer
                .getVariantTracks()

                selectShakaTrack(track);

        if (value.startsWith("hls:") && hlsPlayer) {

            if (

                hlsPlayer.levels[levelIndex]

// =====================================================
// SHAKA
// =====================================================

async function initPlayer() {

    shaka.polyfill.installAll();

    if (!shaka.Player.isBrowserSupported()) {
        throw new Error(
            "Trình duyệt không hỗ trợ Shaka Player"
        );
    }

    // Nếu còn player cũ thì hủy hoàn toàn
    if (shakaPlayer) {
        try {
            await shakaPlayer.destroy();
        } catch (e) {
            console.warn("Destroy old Shaka:", e);
        }

        shakaPlayer = null;
    }

    // Tạo Shaka mới trực tiếp trên video
    shakaPlayer = new shaka.Player(video);

    shakaPlayer.configure({
        manifest: {
            disableAudio: false,
            retryParameters: {
                maxAttempts: 4,
                baseDelay: 300,
                backoffFactor: 1.5
            }
        },
        streaming: {
            retryParameters: {
                maxAttempts: 5,
                baseDelay: 250,
                backoffFactor: 1.5
            },
            lowLatencyMode: false,
            // Tang buffer de video muot hon, it rebuffer tren mang yeu.
            // Nhung buffer goal lon lam hinh len cham o giay dau (phai
            // do du 60s moi nchoi) -> bat dau phat som, ABR tu no them.
            bufferingGoal: 20,
            rebufferingGoal: 4,
            bufferBehind: 90,
            // Cho Shaka tu phuc hoi MSE khi gap loi decode segment
            // (nhieu kenh DASH live tra segment loi thoang qua).
            allowMediaSourceRecoveries: true,
            minBytesForRecovery: 3000
        }
    });

    shakaPlayer.addEventListener(
        "error",
        e => {

            console.error(
                "SHAKA ERROR:",
                e.detail
            );

            const detail = e.detail || {};

            // 3014: stream loi -> thu khoi phuc lai toan bo.
            if (
                detail.code === 3014 &&
                currentDashUrl &&
                dashRecoveryAttempts < 1
            ) {
                dashRecoveryAttempts++;
                status.textContent =
                    "Đang khôi phục luồng...";
                recoverDashPlayback();
                return;
            }

            // 3016: loi decode (thuong do audio track cua kenh loi).
            // Thu tat audio de video van phat duoc.
            if (
                detail.code === 3016 &&
                shakaPlayer &&
                !shakaPlayer.__audioDisabled
            ) {
                shakaPlayer.__audioDisabled = true;
                try {
                    shakaPlayer.configure({
                        manifest: { disableAudio: true }
                    });
                } catch {}
                status.textContent =
                    "Đang phát (không tiếng)...";
                errorBox.textContent = "";
                return;
            }

            errorBox.textContent =
                "Shaka Error:\n" +
                JSON.stringify(
                    detail,
                    null,
                    2
                );
        }
    );

    return shakaPlayer;
}


async function recoverDashPlayback() {
    if (!shakaPlayer || !currentDashUrl) {
        return;
    }

    try {
        await shakaPlayer.unload();

        await shakaPlayer.load(currentDashUrl);
        populateShakaQualities();
        status.textContent = "🔴 Đang phát";
    } catch (error) {
        console.error("DASH RECOVERY ERROR:", error);
        errorBox.textContent =
            "Không thể khôi phục DASH: " +
            error.message;
    }
}

// WARM-UP CDN (preconnect)
// =====================================================
// Khi playlist da tai xong, lay ten host cua cac kenh dau danh sach va
// bat trinh duyet mo san DNS+TLS toi CDN (nhu VLC khong phai cho DNS).

// =====================================================

// =====================================================
async function loadTvData(force = false) {
    const cacheKey = "tv";
    const cached = playlistCache.get(cacheKey);

    if (!force && cached && Date.now() - cached.time < PLAYLIST_CACHE_TIME) {
        applyTvData(cached.data);
        return;
    }

    list.innerHTML = skeletonCards(8);
    groups.innerHTML = "";

    try {
        let data = null;
        let lastError = null;

        for (let attempt = 1; attempt <= 3; attempt++) {
            try {
                const response = await fetch("/api/channels?type=tv");

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const json = await response.json();

                if (!json.ok) {
                    throw new Error(json.error || "Không tải được playlist");
                }

                data = json;
                lastError = null;
                break;
            } catch (e) {
                lastError = e;

                if (attempt < 3) {
                    list.innerHTML = `<div class="empty">Đang thử lại (${attempt}/3)...</div>`;
                    await new Promise(r => setTimeout(r, 1200 * attempt));
                }
            }
        }

        if (lastError || !data) {
            if (cached) {
                applyTvData(cached.data);
                return;
            }
            throw lastError || new Error("Không tải được playlist");
        }

        playlistCache.set(cacheKey, { time: Date.now(), data });
        applyTvData(data);
    } catch (err) {
        console.error(err);
        list.innerHTML = `
            <div class="empty" style="color:#f44">
                Lỗi tải playlist<br><br>${escapeHtml(err.message)}
            </div>`;
    }
}


// Khi nguoi dung bam kenh, ket noi da san sang -> bat dau phat nhanh hon
// 100-500ms tren mobile (quan trong voi list ttthethao5).
function warmUpStreamHosts(items) {

    const hosts =
        new Set();

    const push =
        url => {
            try {
                const u =
                    new URL(
                        String(url || "")
                    );

                if (
                    u.protocol === "https:" ||
                    u.protocol === "http:"
                ) {
                    hosts.add(u.origin);
                }
            } catch {}
        };

    for (
        const item of
        (items || [])
    ) {

        // TV / football: item.url hoac item.channels[].url
        if (item && item.url) {
            push(item.url);
        }

        if (item && item.channels) {
            for (const ch of item.channels) {
                if (ch && ch.url) {
                    push(ch.url);
                }
            }
        }

        // vnfootball: site.matches[].streams[].url
        if (item && item.matches) {
            for (const m of item.matches) {
                for (const s of (m.streams || [])) {
                    if (s && s.url) {
                        push(s.url);
                    }
                }
            }
        }

        if (hosts.size >= 8) {
            break;
        }
    }

    let added = 0;

    for (
        const origin of
        hosts
    ) {

        // Tranh inject trung khi tab duoc tai lai du lieu.
        if (
            document.querySelector(
                'link[rel="preconnect"][href="' + origin + '"]'
            )
        ) {
            continue;
        }

        if (added >= 8) {
            break;
        }

        added++;

        const pre =
            document.createElement(
                "link"
            );

        pre.rel =
            "preconnect";

        pre.href =
            origin;

        // fetch() cua hls.js la CORS-mode -> can crossorigin moi reuse ket noi.
        pre.crossOrigin =
            "anonymous";

        document.head.appendChild(
            pre
        );

        const dns =
            document.createElement(
                "link"
            );

        dns.rel =
            "dns-prefetch";

        dns.href =
            origin;

        document.head.appendChild(
            dns
        );
    }
}

async function loadData(force = false) {

    // ==================================================
    // CACHE PHIA CLIENT: bam qua lai giua cac tab khong goi lai API.
    // ==================================================
    const cacheKey = mode;
    const cached = playlistCache.get(cacheKey);

    if (
        !force &&
        cached &&
        Date.now() - cached.time < PLAYLIST_CACHE_TIME
    ) {
        applyData(cached.data);
        return;
    }

    // Skeleton: hien ngay cac the xam gia thay vi cho trang.
    list.innerHTML =
        skeletonCards(8);

    groups.innerHTML =
        "";

    try {

        // Nguon chap chon -> thu lai vai lan thay vi bao loi ngay.
        let data = null;
        let lastError = null;

        for (let attempt = 1; attempt <= 3; attempt++) {
            try {
                // Bo cache-bust: de trinh duyet/cache dung du lieu cu,
                // giam request len nguon.
                const response =
                    await fetch(
                        "/api/channels?type=" +
                        encodeURIComponent(
                            mode
                        )
                    );

                if (!response.ok) {
                    throw new Error(
                        "HTTP " + response.status
                    );
                }

                const json = await response.json();

                if (!json.ok) {
                    throw new Error(
                        json.error ||
                        "Không tải được playlist"
                    );
                }

                data = json;
                lastError = null;
                break;

            } catch (e) {
                lastError = e;

                if (attempt < 3) {
                    list.innerHTML =
                        `<div class="empty">Đang thử lại (${attempt}/3)...</div>`;

                    await new Promise(r =>
                        setTimeout(r, 1200 * attempt)
                    );
                }
            }
        }

        if (lastError || !data) {
            // Neu mang loi nhung co cache cu -> dung cache cu.
            if (cached) {
                applyData(cached.data);
                return;
            }

            throw lastError || new Error("Không tải được playlist");
        }

        playlistCache.set(cacheKey, {
            time: Date.now(),
            data
        });


        applyData(data);

    } catch (err) {

        console.error(err);


        list.innerHTML =
            `
            <div
                class="empty"
                style="color:#f44"
            >
                Lỗi tải playlist
                <br><br>
                ${escapeHtml(
                    err.message
                )}
            </div>
                        `;
                }
            }

            // Ap dung du lieu da tai (tu fetch hoac tu cache client) vao UI.
            function applyTvData(data) {
                var arr = (data && data.channels) ? data.channels : [];
                // Filter CHI ap dung cho danh sach TV (vmt47):
                // bo nhom BLV Ga Vang, CoLa TV...
                // (danh sach bong da ttthethao6 khong di qua ham nay).
                tvData = arr.filter(function(channel) {
                    var g = ((channel && channel.group) || "").toLowerCase();
                    return !(g.indexOf("gavang") !== -1 ||
                             g.indexOf("colatv") !== -1 ||
                             g.indexOf("colatvm") !== -1 ||
                             g.indexOf("khandai") !== -1 ||
                             g.indexOf("baucua") !== -1);
                });
                renderTV();
                warmUpStreamHosts(tvData);
            }

            function applyFootballData(data) {
                vnSites = (data && data.sites) ? data.sites.slice() : [];
                renderVnFootball();
                warmUpStreamHosts(vnSites);
            }

            // =====================================================
            // FOOTBALL DATA LOAD (ttthethao5) — KHÔNG filter BLV
            // =====================================================

            async function loadFootballData(force = false) {

                const cacheKey = "vnfootball";

                            if (attempt < 3) {
                                list.innerHTML =
                                    `<div class="empty">Đang thử lại (${attempt}/3)...</div>`;

                                await new Promise(r =>

                        }
                    }

                    if (lastError || !data) {
                        if (cached) {
                            applyFootballData(cached.data);
                            return;
                        }

                    }

            // =====================================================

    let channels =
        match.channels ||

// Link khong khoa (khong clearKeys, khong Referer/UA la) thi phat
// thang duoc nhu VLC -> khong can goi API server.
// URL thuoc nguon can UA rieng (vmttv/dpdns/tv360/mytvnet/vtvprime/seenow
// - playlist vmt47) -> phai di qua server.
const NEEDS_PROXY_URL_RE =
    /tv360|vmttv|dpdns|mytvnet|vtvprime|seenow\.vn/i;

function channelNeedsServer(channel) {

    const keys =
        (channel && channel.clearKeys) || {};

    if (Object.keys(keys).length > 0) {
        return true;
    }

    const url =
        String((channel && channel.url) || "");

    // Nguon vmt47 nhieu kenh chi tra stream dung khi duoc goi voi
    // User-Agent Dalvik; JS khong doi duoc User-Agent -> qua proxy.
    if (NEEDS_PROXY_URL_RE.test(url)) {
        return true;
    }

    // FLV phat duoc truc tiep bang mpegts.js (type "flv"), khong can server.

    const headers =
        (channel && channel.headers) || {};

    if (headers.Referer || headers.referer) {
        return true;
    }

    const ua =
        String(
            headers["User-Agent"] ||
            headers["user-agent"] ||
            ""
        );

    // Playlist khai UA khac browser (Dalvik, VThanhTivi, cvmedia,
    // Mozilla Android Mobile...) -> JS khong set duoc UA do -> qua proxy.
    if (
        ua &&
        (!/mozilla\/5\.0/i.test(ua) ||
            /android.*mobile/i.test(ua))
    ) {
        return true;
    }

    return false;
}


// =====================================================
// PHAT THANG NHU VLC (KHONG GOI API)
// =====================================================

function resolveWithTimeout(promise, ms, label) {

    let timer = null;

    const timeout =
        new Promise((_, reject) => {
            timer =
                setTimeout(
                    () =>
                        reject(new Error((label || "timeout") + " sau " + ms + "ms")),
                    ms
                );
        });

    // Quan trong: promise goc (hls/mpegts/...) co the treo nen khi sai
    // loai stream. Gan catch de tranh unhandled rejection, va stopPlayer
    // truoc moi attempt tiep theo de khong chay ngam 2 player.
    if (promise && typeof promise.catch === "function") {
        promise.catch(() => {});
    }

    return Promise.race([promise, timeout]).finally(
        () => {
            if (timer) {
                clearTimeout(timer);
            }
        }
    );
}


async function playHlsDirectOnly(url) {

    // Ban truc tiep (VLC-style): fail-fast, KHONG retry dai,
    // KHONG fallback proxy. Sai loai -> reject nhanh de thu kieu tiep.
    if (
        typeof Hls !== "undefined" &&
        Hls.isSupported()
    ) {
        await stopPlayer();

        hlsPlayer = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            // Vao nhanh hon direct (VLC-style): dung 2 segment sau live edge
            // thay vi 3; neu lateness vuot thi no nhanh lai max 8 segment.
            liveSyncDurationCount: 2,
            liveMaxLatencyDurationCount: 8,
            maxLiveSyncPlaybackRate: 1.5,
            backBufferLength: 30,
            maxBufferLength: 30,
            maxBufferSize: 60 * 1000 * 1000,
            maxMaxBufferLength: 60,
            capLevelToPlayerSize: true,
            // Truoc khi phat duoc: cho manifest thu vai lan (link VN qua
            // redirect tinyurl hay hiccup lan dau, VLC van cho) nhung van
            // fail trong vong vai giay de khong tre qua lau.
            manifestLoadingMaxRetry: 3,
            manifestLoadingMaxRetryTimeout: 3000,
            levelLoadingMaxRetry: 2,
            levelLoadingMaxRetryTimeout: 4000,
            fragLoadingMaxRetry: 2,
            fragLoadingMaxRetryTimeout: 4000,
            abrEwmaDefaultEstimate: 1500000,
            abrBandWidthFactor: 0.9,
            startLevel: -1
        });

        await new Promise((resolve, reject) => {
            let done = false;
            let recoverTries = 0;

            const ok = async () => {
                if (done) {
                    return;
                }

                done = true;
                populateHlsQualities();

                try {
                    await video.play();
                } catch (e) {
                    console.warn("Autoplay:", e);
                }

                resolve();
            };

            const fail = (msg) => {
                if (done) {
                    return;
                }

                done = true;
                reject(new Error(msg || "Khong phai HLS"));
            };

            hlsPlayer.on(Hls.Events.MANIFEST_PARSED, ok);

            hlsPlayer.on(
                Hls.Events.ERROR,
                (event, data) => {
                    if (!data || !data.fatal) {
                        return;
                    }

                    // Chua phat duoc (chua qua MANIFEST_PARSED) -> khong phai
                    // HLS hoac link hong -> fail de thu kieu khac.
                    if (!done) {
                        fail("HLS: " + (data.details || data.type || "fatal"));
                        return;
                    }

                    // Da dang phat: tu phuc hoi nhu VLC (khong den hinh den).
                    recoverTries++;

                    if (recoverTries > 6) {
                        console.warn("HLS recover qua gioi han, dung thu lai");
                        return;
                    }

                    try {
                        if (
                            data.type === Hls.ErrorTypes.NETWORK_ERROR
                        ) {
                            if (
                                data.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR ||
                                data.details === Hls.ErrorDetails.MANIFEST_LOAD_TIMEOUT
                            ) {
                                hlsPlayer.loadSource(hlsPlayer.url);
                            }
                            hlsPlayer.startLoad();
                        } else if (
                            data.type === Hls.ErrorTypes.MEDIA_ERROR
                        ) {
                            hlsPlayer.recoverMediaError();
                        } else {
                            hlsPlayer.startLoad();
                        }
                    } catch (e) {
                        console.warn("HLS recover error:", e);
                    }
                }
            );

            try {
                hlsPlayer.attachMedia(video);
                hlsPlayer.loadSource(url);
            } catch (e) {
                fail(e && e.message);
            }
        });

        return;
    }

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {
        await loadVideoSource(url);

        try {
            await video.play();
        } catch (e) {
            console.warn("Autoplay:", e);
        }

        return;
    }

    throw new Error("Trinh duyet khong ho tro HLS");
}


async function playMpegTsDirectOnly(url) {

    if (
        typeof mpegts === "undefined" ||
        !mpegts.isSupported()
    ) {
        throw new Error("Trinh duyet chua ho tro MPEG-TS");
    }

    await stopPlayer();
    mpegtsRecoverCount = 0;

    await new Promise((resolve, reject) => {
        let done = false;

        const ok = () => {
            if (done) {
                return;
            }

            done = true;
            resolve();
        };

        const fail = (msg) => {
            if (done) {
                return;
            }

            done = true;
            reject(new Error(msg || "Khong phai MPEG-TS"));
        };

        mpegtsPlayer = mpegts.createPlayer(
            {
                // Link .flv can type "flv" (mpegts.js la fork cua flv.js,
                // decode duoc FLV qua HTTP); con lai la mpegts.
                type: /\.flv(?:\?|$)/i.test(url) ? "flv" : "mpegts",
                url,
                isLive: true
            },
            {
                enableWorker: true,
                enableStashBuffer: false,
                liveBufferLatencyChasing: true,
                liveBufferLatencyMaxLatency: 8,
                liveBufferLatencyMinRemain: 2
            }
        );

        mpegtsPlayer.on(
            mpegts.Events.ERROR,
            (type, detail) => {
                // Chua co frame nao ma da ERROR -> sai loai / link hong.
                if (!video.currentTime) {
                    fail("MPEGTS: " + type);
                    return;
                }

                // Dang phat ma loi nhe -> ke tiep, khong fail attempt.
                try {
                    mpegtsPlayer.load();
                    mpegtsPlayer.play();
                } catch {}
            }
        );

        video.addEventListener("loadeddata", ok, { once: true });
        video.addEventListener("playing", ok, { once: true });

        try {
            mpegtsPlayer.attachMediaElement(video);
            mpegtsPlayer.load();
            mpegtsPlayer.play();
        } catch (e) {
            fail(e && e.message);
        }
    });
}


async function playDashDirectOnly(url) {

    currentDashUrl = url;
    dashRecoveryAttempts = 0;

    if (!shakaPlayer) {
        await initPlayer();
    }

    await shakaPlayer.configure({ drm: { clearKeys: {} } });
    await shakaPlayer.load(url);
    populateShakaQualities();

    try {
        await video.play();
    } catch (e) {
        console.warn("Autoplay:", e);
    }
}


async function tryPlayUrlDirect(rawUrl, label) {

    const url = String(rawUrl || "");

    if (!url) {
        throw new Error("Thieu URL stream");
    }

    const suffix = label ? " • " + label : "";

    const isFlv = /\.flv(?:\?|$)/i.test(url);
    const isHlsUrl = isHLS(url);
    const isTsUrl = /\.ts(?:\?|$)/i.test(url);
    const isMpdUrl = isMPD(url);

    // FLV: khong thu HLS/video vo ich — vao thang mpegts (type
    // "flv") de nhanh nhu VLC, tranh mat ~30s lan luot thu sai loai.
    if (isFlv && typeof mpegts !== "undefined" && mpegts.isSupported()) {
        try {
            status.textContent = "⏳ Đang thử FLV" + suffix + "...";
            await resolveWithTimeout(playMpegTsDirectOnly(url), 12000, "flv");
            status.textContent = "🔴 Đang phát" + suffix;
            return "mpegts";
        } catch (e) {
            console.warn("DIRECT: khong phai FLV:", e && e.message);
        }

        await stopPlayer();

        throw new Error("Không phát được luồng FLV");
    }

    // Dung duoi file de chon DUNG loai player ngay lan dau (nhu VLC):
    // .m3u8 -> HLS, .ts -> MPEG-TS, .mpd -> DASH; khong lan luot thu
    // cac loai con lai cho ton thoi gian.

    if (isHlsUrl) {
        try {
            status.textContent = "⏳ Đang thử HLS" + suffix + "...";
            // Cho 15s: HLS là dạng ưu tiên của các luồng bóng đá VN (ttthethao5),
            // hiccup mạng lần đầu không nên bỏ luồng sống quá sớm như VLC.
            await resolveWithTimeout(playHlsDirectOnly(url), 15000, "HLS");
            status.textContent = "🔴 Đang phát" + suffix;
            return "hls";
        } catch (e) {
            console.warn("DIRECT: HLS fail:", e && e.message);
        }

        await stopPlayer();

        throw new Error("Không phát được luồng HLS");
    }

    if (isTsUrl && typeof mpegts !== "undefined" && mpegts.isSupported()) {
        try {
            status.textContent = "⏳ Đang thử MPEG-TS" + suffix + "...";
            await resolveWithTimeout(playMpegTsDirectOnly(url), 12000, "mpegts");
            status.textContent = "🔴 Đang phát" + suffix;
            return "mpegts";
        } catch (e) {
            console.warn("DIRECT: MPEG-TS fail:", e && e.message);
        }

        await stopPlayer();

        throw new Error("Không phát được luồng MPEG-TS");
    }

    if (isMpdUrl) {
        try {
            status.textContent = "⏳ Đang thử DASH" + suffix + "...";
            await resolveWithTimeout(playDashDirectOnly(url), 12000, "dash");
            status.textContent = "🔴 Đang phát" + suffix;
            return "dash";
        } catch (e) {
            console.warn("DIRECT: DASH fail:", e && e.message);
        }

        await stopPlayer();

        throw new Error("Không phát được luồng DASH");
    }

    // Khong biet duoi file (link redirect, query lau doi...) -> thu
    // lan luot nhu truoc.

    try {
        status.textContent = "⏳ Đang thử HLS" + suffix + "...";
        await resolveWithTimeout(playHlsDirectOnly(url), 15000, "HLS");
        status.textContent = "🔴 Đang phát" + suffix;
        return "hls";
    } catch (e) {
        console.warn("DIRECT: khong phai HLS:", e && e.message);
    }

    await stopPlayer();

    try {
        status.textContent = "⏳ Đang thử video" + suffix + "...";
        await resolveWithTimeout(playDirectVideo(url, ""), 8000, "video");
        status.textContent = "🔴 Đang phát" + suffix;
        return "video";
    } catch (e) {
        console.warn("DIRECT: khong phai video:", e && e.message);
    }

    await stopPlayer();

    if (typeof mpegts !== "undefined" && mpegts.isSupported()) {
        try {
            status.textContent = "⏳ Đang thử MPEG-TS" + suffix + "...";
            await resolveWithTimeout(playMpegTsDirectOnly(url), 8000, "mpegts");
            status.textContent = "🔴 Đang phát" + suffix;
            return "mpegts";
        } catch (e) {
            console.warn("DIRECT: khong phai mpegts:", e && e.message);
        }

        await stopPlayer();
    }

    try {
        status.textContent = "⏳ Đang thử DASH" + suffix + "...";
        await resolveWithTimeout(playDashDirectOnly(url), 10000, "dash");
        status.textContent = "🔴 Đang phát" + suffix;
        return "dash";
    } catch (e) {
        console.warn("DIRECT: khong phai dash:", e && e.message);
    }

    await stopPlayer();

    throw new Error("Khong phat truc tiep duoc");
}


// =====================================================
// PLAY FOOTBALL
// =====================================================

async function playFootballChannel(
    channel
) {

    errorBox.textContent =
        "";


    title.textContent =
        currentMatch
            ? currentMatch.name
            : "Đang phát";


    status.textContent =
        "Đang mở...";


    showCurrentSource(
        channel
    );


    try {

        await stopPlayer();

        // Link khong khoa -> phat thang nhu VLC, KHONG goi API server.
        if (!channelNeedsServer(channel)) {
            try {
                await tryPlayUrlDirect(
                    channel.url,
                    channel.commentator || "Kênh thể thao"
                );

                return;
            } catch (directErr) {
                console.warn(
                    "DIRECT hong, chuyen sang API:",
                    directErr && directErr.message
                );
            }
        }

        const cacheKey =
            "football:" + channel.streamId;

        const cached =
            streamCache.get(cacheKey);

        let result;

        if (
            cached &&
            Date.now() - cached.time <
                STREAM_CACHE_TIME
        ) {
            result = cached.data;
        } else {
            const response =
                await fetch(
                    "/api/football/stream/" +
                    encodeURIComponent(
                        channel.streamId
                    )
                );

            result =
                await response.json();

            if (result.ok) {
                streamCache.set(
                    cacheKey,
                    {
                        time: Date.now(),
                        data: result
                    }
                );
            }
        }


        if (
            !result.ok
        ) {

            throw new Error(
                result.error ||
                "Không lấy được stream"
            );
        }


        await stopPlayer();


        const sources =
            pickPlaySources(result);

        const url =
            sources.primary ||
            result.url;


        const fallbackUrl =
            sources.fallback;


        // ==================================================
        // DASH
        // ==================================================

        if (
            isMPD(url) ||
            Object.keys(
                result.clearKeys ||
                {}
            ).length
        ) {

            currentDashUrl = url;
            dashRecoveryAttempts = 0;

            if (
                !shakaPlayer
            ) {

                await initPlayer();
            }


            shakaPlayer.configure({

                drm: {

                    clearKeys:
                        result.clearKeys ||
                        {}
                }
            });


            await shakaPlayer.load(
                url
            );

            populateShakaQualities();


            status.textContent =
                "🔴 Đang phát • " +
                (
                    channel.commentator ||
                    "Kênh thể thao"
                );


            return;
        }


        // ==================================================
        // HLS
        // ==================================================

        if (
            result.kind === "hls" ||
            isHLS(url)
        ) {

            await playHLS(
                url,
                fallbackUrl
            );

            return;
        }

        if (
            result.contentType === "video/mp2t" ||
            /\.ts(?:\?|$)/i.test(url)
        ) {
            await playMpegTs(url);
            status.textContent =
                "🔴 Đang phát • " +
                (channel.commentator || "Kênh thể thao");
            return;
        }


        // ==================================================
        // VIDEO
        // ==================================================

        await playDirectVideo(
            url,
            fallbackUrl
        );


        status.textContent =
            "🔴 Đang phát • " +
            (
                channel.commentator ||
                "Kênh thể thao"
            );

    } catch (err) {

        console.error(
            "FOOTBALL PLAY ERROR:",
            err
        );


        status.textContent =
            "Không phát được";


        errorBox.textContent =
            err.message ||
            String(err);
    }
}

// =====================================================
// Server trả về:
//   playUrl         : nguồn ưu tiên (URL gốc CDN nếu phát trực tiếp được,
//                     ngược lại là URL proxy của server)
//   playFallbackUrl : nguồn dự phòng dùng khi nguồn ưu tiên lỗi
//   directUrl       : URL gốc CDN
//   corsBlocksHls   : true khi CDN thiếu CORS (hls.js bị chặn)
//
// Thiết bị dùng MSE (hls.js) cần CORS nên đi theo server. Safari/iPhone
// phát HLS native (không bị CORS chặn) -> ưu tiên URL gốc cho mượt như VLC.

function pickPlaySources(result) {

    const primary =
        result.playUrl ||
        result.finalUrl ||
        result.url ||
        "";

    const fallback =
        result.playFallbackUrl || "";

    const nativeHls =
        !(typeof Hls !== "undefined" && Hls.isSupported()) &&
        video.canPlayType("application/vnd.apple.mpegurl");

    // Nguồn chỉ phải proxy vì thiếu CORS mà máy này không dùng MSE:
    // phát trực tiếp từ CDN cho mượt, proxy làm nguồn dự phòng.
    if (
        nativeHls &&
        result.corsBlocksHls &&
        result.directUrl &&
        result.directUrl !== primary
    ) {
        return {
            primary: result.directUrl,
            fallback: primary
        };
    }

    // Nguồn ưu tiên là URL proxy (nguồn đòi Referer/User-Agent riêng) thì URL
    // gốc chắc chắn không phát được trên browser -> bỏ dự phòng trực tiếp.
    if (/^\/api\/proxy\?/.test(primary)) {
        return {
            primary,
            fallback: ""
        };
    }

    return {
        primary,
        fallback
    };
}


// =====================================================
// HLS
// =====================================================

async function playHLS(
    url,
    fallbackUrl
) {

    /*
     * playHLS() được gọi sau stopPlayer()
     * nên lúc này HLS/Shaka cũ đã được hủy.
     *
     * url         : nguồn ưu tiên (URL gốc CDN -> tải trực tiếp cho mượt
     *               như VLC, không đi vòng qua server).
     * fallbackUrl : nguồn dự phòng (thường là /api/proxy) dùng khi nguồn
     *               chính bị CORS/403/mạng -> tự chuyển, không treo hình.
     */

    // Chỉ đổi sang nguồn dự phòng 1 lần cho mỗi lần bấm kênh.
    let hlsFallbackUsed = false;

    if (
        typeof Hls !== "undefined" &&
        Hls.isSupported()
    ) {

        hlsPlayer =
            new Hls({

                enableWorker:
                    true,

                // Tat lowLatencyMode: LL-HLS buoc phai tai segment nho lien tuc,
                // mang yeu se giut lien tuc. Tueuuan buffer dai hon cho muot.
                lowLatencyMode:
                    false,

                // Giam sync duration de bat dau phat nhanh hon (4 * targetDuration).
                liveSyncDurationCount:
                    3,

                liveMaxLatencyDurationCount:
                    10,

                maxLiveSyncPlaybackRate:
                    1.5,

                backBufferLength:
                    30,

                // Buffer vua du cho live: 60s lam tre live qua lau + ton RAM
                // mobile (hls.js giu 90MB trong bo nho). 30s van muot tren
                // mang yeu ma khong bi "dung hinh tich luy" nhu truoc.
                maxBufferLength:
                    30,

                maxBufferSize:
                    60 * 1000 * 1000,

                maxMaxBufferLength:
                    60,

                // Mobile: gioi han chat luong theo kich thuoc khung hinh ->
                // giam bang thong, it giat hon han khi mang yeu.
                capLevelToPlayerSize:
                    true,

                manifestLoadingMaxRetry:
                    5,

                levelLoadingMaxRetry:
                    5,

                fragLoadingMaxRetry:
                    5,

                fragLoadingMaxRetryTimeout:
                    3000,

                // ABR: bat dau o muc uoc luong ~1.5 Mbps thay vi muc thap nhat
                // -> len nhanh hon, mang yeu van duoc chuan do rebuffer.
                abrEwmaDefaultEstimate: 1500000,

                abrBandWidthFactor: 0.9,

                startLevel: -1
            });


        hlsPlayer.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.error(
                    "HLS ERROR:",
                    data
                );


                if (!data.fatal) {
                    return;
                }


                if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {
                    // Nguồn chính (phát trực tiếp từ CDN) bị chặn: CORS,
                    // 403/404/URL hết hạn... -> chuyển ngay sang nguồn dự
                    // phòng (proxy của server) thay vì để đứng hình.
                    if (fallbackUrl && !hlsFallbackUsed) {
                        hlsFallbackUsed = true;

                        console.warn(
                            "HLS: nguồn chính lỗi (" +
                            data.details +
                            ") -> chuyển nguồn dự phòng"
                        );

                        const deadPlayer = hlsPlayer;
                        hlsPlayer = null;

                        Promise.resolve(
                            deadPlayer?.destroy?.()
                        )
                            .catch(() => {})
                            .then(() => playHLS(fallbackUrl))
                            .catch(err => {
                                console.error(
                                    "HLS FALLBACK ERROR:",
                                    err
                                );
                                errorBox.textContent =
                                    err?.message || String(err);
                            });

                        return;
                    }

                    // Loi manifest/level/fragment mang: bam dau hien tai ->
                    // startLoad() se tai lai tu segment dang dung, khong restart tu dau.
                    try {
                        if (data.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR ||
                            data.details === Hls.ErrorDetails.MANIFEST_LOAD_TIMEOUT) {
                            hlsPlayer.loadSource(hlsPlayer.url);
                        }
                        hlsPlayer.startLoad();
                    } catch {}

                    return;
                }


                if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {
                    // Thu recover media; neu bi gap loi -> append vao hang cho doi.
                    try {
                        hlsPlayer.recoverMediaError();
                    } catch {}

                    return;
                }


                errorBox.textContent =
                    "HLS Error:\n" +
                    JSON.stringify(
                        data,
                        null,
                        2
                    );
            }
        );


        hlsPlayer.on(
            Hls.Events.MANIFEST_PARSED,
            async () => {

                populateHlsQualities();

                try {

                    await video.play();

                    status.textContent =
                        "🔴 Đang phát";

                } catch (e) {

                    console.warn(
                        "Autoplay:",
                        e
                    );
                }
            }
        );


        hlsPlayer.attachMedia(
            video
        );


        hlsPlayer.loadSource(
            url
        );


        return;
    }


    /*
     * Safari / browser có HLS native
     */

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src =
            url;


        await video.play();


        status.textContent =
            "🔴 Đang phát";

        return;
    }


    throw new Error(
        "Trình duyệt không hỗ trợ HLS"
    );
}


// =====================================================
// VIDEO TRỰC TIẾP (mp4/ts...) + NGUỒN DỰ PHÒNG
// =====================================================
// File video phát trực tiếp từ CDN cho mượt (giống VLC); nếu nguồn lỗi
// 403/404/mạng thì tự chuyển sang URL dự phòng (proxy) trước khi báo lỗi.

function loadVideoSource(src) {

    return new Promise((resolve, reject) => {

        const onError = () => {
            cleanup();

            reject(
                new Error(
                    "Không tải được video (mã lỗi " +
                    (video.error ? video.error.code : "?") +
                    ")"
                )
            );
        };

        const onLoaded = () => {
            cleanup();
            resolve();
        };

        const cleanup = () => {
            video.removeEventListener("error", onError);
            video.removeEventListener("loadeddata", onLoaded);
        };

        video.addEventListener("error", onError);
        video.addEventListener("loadeddata", onLoaded);

        video.src = src;
    });
}


async function playDirectVideo(url, fallbackUrl) {

    const candidates = [url];

    if (fallbackUrl && fallbackUrl !== url) {
        candidates.push(fallbackUrl);
    }

    let lastError = null;

    for (const src of candidates) {

        try {

            await loadVideoSource(src);

        } catch (e) {

            lastError = e;

            console.warn(
                "VIDEO nguồn lỗi, thử nguồn tiếp theo:",
                src,
                e.message
            );

            continue;
        }

        try {
            await video.play();
        } catch (e) {
            console.warn("Autoplay:", e);
        }

        return;
    }

    throw lastError || new Error("Không phát được video");
}

let mpegtsRecoverCount = 0;

function playMpegTsOnce(url) {
    mpegtsPlayer = mpegts.createPlayer(
        {
            // .flv can type "flv" (mpegts.js ho tro FLV qua HTTP).
            type: /\.flv(?:\?|$)/i.test(url) ? "flv" : "mpegts",
            url,
            isLive: true
        },
        {
            enableWorker: true,
            enableStashBuffer: false,
            liveBufferLatencyChasing: true,
            liveBufferLatencyMaxLatency: 8,
            liveBufferLatencyMinRemain: 2
        }
    );

    mpegtsPlayer.on(
        mpegts.Events.ERROR,
        (type, detail) => {
            console.error(
                "MPEGTS ERROR:",
                type,
                detail
            );

            if (
                mpegtsPlayer &&
                mpegtsPlayer.mediaSource &&
                video.currentTime > 0
            ) {
                // Lỗi nhẹ, thử tiếp tục tải
                try {
                    mpegtsPlayer.load();
                    mpegtsPlayer.play();
                } catch {}

                return;
            }

            // Lỗi nghiêm trọng: dựng lại player (tối đa 3 lần)
            mpegtsRecoverCount++;

            if (mpegtsRecoverCount > 3) {
                errorBox.textContent =
                    "MPEG-TS Error:\n" +
                    type +
                    " " +
                    (detail?.message || "");
                return;
            }

            const retryUrl = url;

            mpegtsPlayer?.destroy?.().catch?.(() => {});
            mpegtsPlayer = null;

            setTimeout(() => {
                try {
                    playMpegTsOnce(retryUrl);
                    mpegtsPlayer?.play?.();
                } catch {}
            }, 800);
        }
    );

    mpegtsPlayer.attachMediaElement(video);
    mpegtsPlayer.load();
    mpegtsPlayer.play();
}

async function playMpegTs(url) {
    if (
        typeof mpegts === "undefined" ||
        !mpegts.isSupported()
    ) {
        throw new Error(
            "Trình duyệt chưa hỗ trợ MPEG-TS"
        );
    }

    mpegtsRecoverCount = 0;

    playMpegTsOnce(url);
}

    currentVnMatch =
        match;

    // Render panel (doi luong/BLV) TRUOC khi bat dau phat de nguoi

async function playVnStream(stream) {

    const channel = {

        name:
            (currentVnMatch && currentVnMatch.title
                ? currentVnMatch.title
                : "Trận đấu") +
            " (" + stream.name + ")",

        logo:
            currentVnMatch && currentVnMatch.logo
                ? currentVnMatch.logo
                : "",

        group:
            currentVnSite || "",

        url:
            stream.url,

        headers:
            stream.headers || {},

        clearKeys:
            stream.clearKeys || {}
    };

    currentChannel =
        channel;

    await playTV(
        channel
    );
}
